  <div class="section"><button class="cta" onclick="dispNew()">ثبت اختلاف تازه</button>
  <div class="card arb-how"><span class="label" style="margin-top:0">داوری حضوری چطور کار می‌کند؟</span>
    ${[['۱','ثبت اختلاف؛ طرف مقابل ۴۸ ساعت فرصت دارد در چت به توافق برسید.'],['۲','حل نشد؟ حوزهٔ مشکل و مبلغ مورد اختلاف را بگو؛ هزینهٔ داوری خودکار حساب می‌شود.'],['۳','ثبت‌کنندهٔ اختلاف هزینه را پیش از تعیین حل‌کننده می‌پردازد؛ پول نزد بلوک امانت می‌ماند.'],['۴','بلوک یک حل‌کنندهٔ بی‌طرف همان حوزه را می‌فرستد (بدون هیچ سابقهٔ همکاری با دو طرف). هر طرف یک بار حق رد دارد.'],['۵','بازدید، گزارش استاندارد با عکس و اندازه‌گیری، و رأی. ۷۲ ساعت مهلت اعتراض و بازبینی با حل‌کنندهٔ دوم.'],['۶','اگر حل‌کننده سر قرار نیاید، کل مبلغ برمی‌گردد.']].map(s=>`<div class="how"><i class="num">${s[0]}</i><span>${s[1]}</span></div>`).join('')}</div>
  ${canJoin?`<button class="card arb-join" onclick="go('arbj')"><span class="aj-i">${I.shield}</span><span><b>${S.arbMe&&S.arbMe.st==='ok'?'پرونده‌های داوری من':'حل‌کنندهٔ حضوری بلوک شو'}</b><small>${S.arbMe&&S.arbMe.st==='ok'?'بازدیدها، گزارش‌ها و درآمد داوری':'برای ۸۰ تا ۸۵٪ هزینهٔ داوری، اختلاف‌های حوزهٔ خودت را حضوری حل کن'}</small></span><em>‹</em></button>`:''}</div>`};
function dispCard(d){const a=d.arb,st=d.st;
  return `<div class="card dcase" id="dc_${d.id}"><div class="need" style="padding-top:0">${hexA(P[d.with])}<div style="flex:1;min-width:0"><b style="display:block">${esc(d.proj)}</b><span style="font-size:13px;color:var(--muted)"><span>با ${esc(P[d.with].name)}</span> · <span>${esc(d.why)}</span> · <span>${d.time}</span></span></div><span class="tag ${st>=4?'ok':'wait'}">${DSTG2[Math.min(st,4)]}</span></div>
    <div class="tline t5">${DSTG2.map((x,k)=>`<div class="${k<st||st>=4?'d':k===st?'n':''}"><i></i><b>${x}</b></div>`).join('')}</div>
    <p style="margin:6px 0 0;font-size:14px;line-height:1.9">${esc(d.desc)}<br><b>درخواست شما:</b> ${esc(d.ask)}</p>
    ${arbBox(d)}
    <div class="rq-a" style="margin-top:10px"><button onclick="openChatWith('${d.with}')">چت با طرف مقابل</button><button onclick="toast('مدرک به پرونده اضافه شد')">افزودن مدرک</button>${st<3&&!(a&&a.paid)?`<button class="yes" onclick="dispClose('${d.id}')">توافق کردیم</button>`:''}</div></div>`}
function arbBox(d){const a=d.arb;
  if(d.st===1&&!a)return `<div class="arbbox"><b>${d.late?'مهلت گفت‌وگو تمام شد و توافقی ثبت نشد':'اگر در ۴۸ ساعت به توافق نرسیدید'}</b><span>یک مهندس یا متخصص بی‌طرفِ همین حوزه را به محل کار بفرست تا ببیند و رأی بدهد.</span>
    ${d.mine?`<button class="cta" onclick="arbAsk('${d.id}')">درخواست حل‌کنندهٔ حضوری</button>`:`<small>درخواست حل‌کننده با ثبت‌کنندهٔ اختلاف است.</small>`}</div>`;
  if(!a)return '';const R=a.who&&P[a.who];
  if(a.st==='match')return `<div class="arbbox"><div class="arb-find"><span class="radar"><i></i><i></i></span><span><b>در حال پیدا کردن حل‌کننده</b><small><span>${esc(a.F)}</span> · <span>${esc(d.place)}</span> · <span>بررسی بی‌طرفی و روزهای آزاد</span></small></span></div><div class="arb-paid">${I.shield}<span>${mny(a.total)} پرداخت شد و نزد بلوک امانت است</span></div></div>`;
  if(a.st==='assigned')return `<div class="arbbox"><div class="arb-r">${hexA(R)}<span><b>${esc(R.name)}</b><small><span>${esc(a.F)}</span> · <span>${esc(R.place)}</span> · <span class="num">★ ${fa(R.rating)}</span> · <span>${fa(R.done)} پرونده</span></small></span><button class="mini" onclick="openProfile('${a.who}')">پروفایل</button></div>
    <div class="arb-ok">✓ بی‌طرفی بررسی شد: هیچ همکاری، پروژه یا گفت‌وگوی قبلی با دو طرف ندارد</div>
    <div class="arb-when"><span>زمان بازدید</span><b>${esc(a.when)}</b></div>
    <div class="arb-paid">${I.shield}<span>${mny(a.total)} امانی · بعد از ثبت گزارش آزاد می‌شود</span></div>
    <div class="rq-a"><button onclick="arbReject('${d.id}')" ${a.rej?'disabled':''}>${a.rej?'حق رد استفاده شد':'رد این حل‌کننده (۱ بار)'}</button><button class="yes" onclick="arbVisit('${d.id}')">شبیه‌سازی بازدید</button></div></div>`;
  if(a.st==='visit')return `<div class="arbbox"><div class="arb-find"><span class="radar"><i></i><i></i></span><span><b>${esc(R.name)} در محل کار است</b><small>عکس، اندازه‌گیری و مقایسه با قرارداد…</small></span></div></div>`;
  if(a.st==='report'||a.st==='appeal')return `<div class="arbbox"><div class="arb-r">${hexA(R)}<span><b><span>${a.st==='appeal'?'رأی بازبینی':'رأی'}</span> <span>${esc(R.name)}</span></b><small>${esc(a.rep.v)}</small></span></div>
    <button class="linkrow" onclick="arbReport('${d.id}')"><span class="ic">${QI.doc}</span><span>دیدن گزارش کامل و رأی</span><small>‹</small></button>
    <div class="arb-when"><span>مهلت اعتراض</span><b class="num">${a.st==='appeal'?'رأی نهایی':'۷۲ ساعت'}</b></div>
    <div class="rq-a">${a.st==='appeal'?'':`<button onclick="arbAppeal('${d.id}')">اعتراض و بازبینی</button>`}<button class="yes" onclick="arbAccept('${d.id}')">قبول رأی و بستن پرونده</button></div></div>`;
  if(a.st==='done')return `<div class="arbbox done"><b>پرونده با رأی حل‌کننده بسته شد</b><span>${esc(a.rep.v)}</span><div class="arb-split"><span>سهم حل‌کننده <b class="num">${mny(a.res+a.travel)}</b></span><span>کمیسیون بلوک <b class="num">${mny(a.blk)}</b></span></div>${a.rated?'':`<button class="ghost" style="width:100%;margin-top:8px" onclick="arbRate('${d.id}')">به حل‌کننده امتیاز بده</button>`}</div>`;
  return ''}

/* ---------- درخواست و محاسبهٔ هزینه ---------- */
function arbAsk(id){const d=S.disp.find(x=>x.id===id);S.arbQ={id,field:arbSuggest(d),amt:120,multi:false,ok:false};arbSheet()}
function arbSheet(){const q=S.arbQ,d=S.disp.find(x=>x.id===q.id),f=arbFee(q,d.place);
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">درخواست حل‌کنندهٔ حضوری</h3><p class="sub"><span>${esc(d.proj)}</span> · <span>${esc(d.place)}</span></p>
  <span class="label">مشکل در کدام حوزه است؟</span><div class="chips">${ARB_F.map(x=>`<button class="chip" aria-pressed="${q.field===x.k}" onclick="S.arbQ.field='${x.k}';arbSheet()">${x.n}</button>`).join('')}</div>
  <p class="hint" style="margin:6px 0 0"><span>${esc(f.F.ex)}</span> · <span>${f.F.who==='engineer'?'حل‌کننده: مهندس همین حوزه':'حل‌کننده: متخصص همین حوزه'}</span></p>
  <span class="label">مبلغ مورد اختلاف (میلیون تومان)</span><div class="arb-amt"><input class="field num" type="range" min="5" max="1500" step="5" value="${q.amt}" oninput="S.arbQ.amt=+this.value;arbFeeUpd()"><b class="num" id="arbAmt">${fa(q.amt)} میلیون</b></div>
  <label class="arb-chk"><input type="checkbox" ${q.multi?'checked':''} onchange="S.arbQ.multi=this.checked;arbFeeUpd()"><span>بیش از یک موضوع (مثلاً هم کیفیت و هم مقدار کار)</span></label>
  <div class="card arb-fee" id="arbFee">${arbFeeHTML(f)}</div>
  <label class="arb-chk"><input type="checkbox" ${q.ok?'checked':''} onchange="S.arbQ.ok=this.checked;$('arbGo').disabled=!this.checked"><span>می‌دانم رأی حل‌کننده پس از ۷۲ ساعت مهلت اعتراض، طبق مادهٔ ۷ قرارداد، برای دو طرف لازم‌الاجراست.</span></label>
  <button class="cta" id="arbGo" ${q.ok?'':'disabled'} onclick="arbPay()">پرداخت امانی و ادامه</button>`;show()}
function arbFeeHTML(f){return `<div class="af-row"><span>هزینهٔ داوری</span><b class="num">${mny(f.fee)}</b></div>
  <small class="af-why"><span>پایه ${mny(ARB_BASE)}</span> × <span>${esc(f.F.n)}</span> <span class="num">(${fa(f.F.f)})</span> × <span>${esc(f.am[2])}</span> <span class="num">(${fa(f.am[1])})</span></small>
  <div class="af-row"><span>رفت‌وآمد ${f.tvk==='city'?'(حل‌کننده در همین شهر)':f.tvk==='prov'?'(داخل استان)':'(از استان دیگر)'}</span><b class="num">${f.travel?mny(f.travel):'رایگان'}</b></div>
  <div class="af-bar"><i style="flex:${100-f.pct}"></i><i class="b" style="flex:${f.pct}"></i></div>
  <div class="af-leg"><span><i></i>حل‌کننده ${fa(100-f.pct)}٪ + رفت‌وآمد</span><span><i class="b"></i>کمیسیون بلوک ${fa(f.pct)}٪ · ${f.cx?'پرونده پیچیده':'پرونده ساده'}</span></div>
  <div class="af-row tot"><span>جمع قابل پرداخت</span><b class="num">${mny(f.total)}</b></div>`}
function arbFeeUpd(){const q=S.arbQ,d=S.disp.find(x=>x.id===q.id);$('arbAmt').textContent=fa(q.amt)+' میلیون';$('arbFee').innerHTML=arbFeeHTML(arbFee(q,d.place))}
function arbPay(){const q=S.arbQ,d=S.disp.find(x=>x.id===q.id),f=arbFee(q,d.place);
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">پرداخت امانی</h3><p class="sub">پیش از تعیین حل‌کننده · ثبت‌کنندهٔ اختلاف می‌پردازد</p>
  <div class="card arb-fee"><div class="af-row tot"><span>مبلغ</span><b class="num">${mny(f.total)}</b></div></div>
  <span class="label">روش پرداخت</span><div class="chips"><button class="chip" aria-pressed="true" onclick="pickOne(this)">درگاه بانکی</button><button class="chip" aria-pressed="false" onclick="pickOne(this)">کیف پول بلوک</button></div>
  <div class="note" style="margin-top:12px">${I.shield}<span>پول نزد بلوک امانت می‌ماند و فقط بعد از ثبت گزارش بازدید به حل‌کننده می‌رسد. اگر حل‌کننده سر قرار نیاید، کامل برمی‌گردد.</span></div>
  <button class="cta" onclick="arbPaid()">پرداخت ${mny(f.total)}</button>`;show()}
function arbPaid(){const q=S.arbQ,d=S.disp.find(x=>x.id===q.id),f=arbFee(q,d.place);
  d.arb=Object.assign({},f,{st:'match',paid:true,field:q.field,F:f.F.n,amt:q.amt});d.st=2;closeSheet();renderDisp();toast('پرداخت شد؛ دنبال حل‌کنندهٔ بی‌طرف می‌گردیم');
  setTimeout(()=>arbAssign(d),2600)}
function arbPick(d,skip){const conv=new Set(S.convs.map(c=>c.pid));
  const L=ARBS.filter(a=>a.f.includes(d.arb.field)&&a.id!==d.with&&!conv.has(a.id)&&!(skip||[]).includes(a.id)).map(a=>a.id);
  L.sort((x,y)=>(P[y].place===d.place)-(P[x].place===d.place)||(provOf(P[y].place)===provOf(d.place))-(provOf(P[x].place)===provOf(d.place)));return L[0]}
function arbAssign(d){const a=d.arb;a.who=arbPick(d,a.skip);if(!a.who){a.who=ARBS.find(x=>x.f.includes(a.field)).id}
  a.st='assigned';a.when=['یکشنبه ۶ مهر · ۱۰ صبح','دوشنبه ۷ مهر · ۸ صبح'][(a.skip||[]).length%2];
  if(S.cur==='disp')renderDisp();notify({t:'حل‌کنندهٔ حضوری تعیین شد',s:P[a.who].name+' — '+a.when,ty:'req',go:"go('disp')"})}
function arbReject(id){const d=S.disp.find(x=>x.id===id),a=d.arb;if(a.rej)return;a.rej=1;(a.skip=a.skip||[]).push(a.who);a.st='match';renderDisp();toast('حل‌کنندهٔ دیگری تعیین می‌شود');setTimeout(()=>arbAssign(d),2000)}
function arbVisit(id){const d=S.disp.find(x=>x.id===id),a=d.arb;a.st='visit';d.st=3;renderDisp();
  setTimeout(()=>{a.st='report';a.rep=arbDemoReport(a);if(S.cur==='disp')renderDisp();notify({t:'گزارش و رأی حل‌کننده ثبت شد',s:a.rep.v,ty:'req',go:"go('disp')"})},2600)}
function arbDemoReport(a){const R={struct:['مقاومت بتن سقف با چکش اشمیت ۲۲ مگاپاسکال؛ قرارداد C25 خواسته. پوشش آرماتور در ۲ نقطه کمتر از ۲٫۵ سانت.','مغایر با قرارداد در بخش بتن؛ آرماتوربندی مطابق نقشه','مجری ۳۰٪ از مبلغ بتن‌ریزی سقف را کسر می‌کند؛ کارفرما باقی مرحلهٔ دوم را ظرف ۷ روز می‌پردازد.'],
  mas:['شاقول دیوار شمالی ۲٫۵ سانت انحراف در ۳ متر؛ ملات ۱ به ۶ به جای ۱ به ۴.','مغایر در دیوار شمالی','مجری دیوار شمالی را ظرف ۵ روز اصلاح می‌کند؛ پرداخت بعد از اصلاح.'],
  qty:['متراژ اجراشده ۲۱۰ متر مربع؛ صورت‌وضعیت مجری ۲۴۰ متر ادعا کرده بود.','اختلاف ۳۰ متر در مقدار کار','پرداخت بر اساس ۲۱۰ متر؛ کارفرما مبلغ اصلاح‌شده را ظرف ۳ روز می‌پردازد.']}[a.field]||['کار با مشخصات قرارداد مقایسه شد؛ ۲ مورد نقص جزئی دیده شد.','مغایرت جزئی','مجری نقص‌ها را ظرف ۵ روز رفع می‌کند و پرداخت انجام می‌شود.'];
  return {m:R[0],c:R[1],v:R[2],ph:4}}
function arbReport(id){const d=S.disp.find(x=>x.id===id),a=d.arb,R=P[a.who],r=a.rep;
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">گزارش بازدید و رأی</h3><p class="sub"><span>${esc(R.name)}</span> · <span>${esc(a.F)}</span> · <span>${esc(d.proj)}</span></p>
  <div class="arb-ph">${Array.from({length:r.ph},(_,k)=>`<span style="--k:${k}">${MI.img}<small>عکس ${fa(k+1)} · ${esc(d.place)}</small></span>`).join('')}</div>
  <div class="arb-rep"><span class="label">اندازه‌گیری و مشاهده</span><p>${esc(r.m)}</p><span class="label">مقایسه با قرارداد و آیین‌نامه</span><p>${esc(r.c)}</p><span class="label">رأی و کار اصلاحی</span><p><b>${esc(r.v)}</b></p></div>
  <div class="note" style="margin-top:10px">${I.shield}<span>عکس‌ها با زمان و مکان ثبت شده‌اند. این گزارش در صورت مراجعه به دادگاه هم مدرک است.</span></div>
  <button class="cta" onclick="closeSheet()">بستن</button>`;show()}
function arbAppeal(id){const d=S.disp.find(x=>x.id===id),a=d.arb,fee=Math.round(a.fee/2/10000)*10000;
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">اعتراض و بازبینی</h3><p class="sub">یک حل‌کنندهٔ دوم (غیر از قبلی) گزارش را بررسی و در صورت نیاز دوباره بازدید می‌کند</p>
  <div class="card arb-fee"><div class="af-row"><span>هزینهٔ بازبینی (نصف هزینهٔ داوری)</span><b class="num">${mny(fee)}</b></div><small class="af-why">اگر رأی عوض شود، این مبلغ به تو برمی‌گردد. رأی بازبینی نهایی است.</small></div>
  <span class="label">دلیل اعتراض</span><textarea class="field" id="apW" rows="3" placeholder="کدام بخش گزارش یا رأی نادرست است؟"></textarea>
  <button class="cta" onclick="if($('apW').value.trim().length<10){toast('دلیل اعتراض را کامل‌تر بنویس');return}arbAppealGo('${id}')">پرداخت و ثبت اعتراض</button>`;show()}
function arbAppealGo(id){const d=S.disp.find(x=>x.id===id),a=d.arb;(a.skip=a.skip||[]).push(a.who);closeSheet();a.st='match';renderDisp();toast('اعتراض ثبت شد؛ حل‌کنندهٔ دوم تعیین می‌شود');
  setTimeout(()=>{a.who=arbPick(d,a.skip)||a.who;a.st='appeal';a.rep=Object.assign({},a.rep,{v:'رأی قبلی تأیید شد؛ '+a.rep.v});if(S.cur==='disp')renderDisp();notify({t:'رأی بازبینی ثبت شد',s:'رأی نهایی است',ty:'req',go:"go('disp')"})},3000)}
function arbAccept(id){const d=S.disp.find(x=>x.id===id);d.arb.st='done';d.st=4;renderDisp();toast('پرونده بسته شد؛ سهم حل‌کننده آزاد شد')}
function arbRate(id){const d=S.disp.find(x=>x.id===id),R=P[d.arb.who];
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">امتیاز به حل‌کننده</h3><p class="sub">${esc(R.name)}</p>
  <div class="chips" style="justify-content:center">${[1,2,3,4,5].map(n=>`<button class="chip" aria-pressed="${n===5}" onclick="pickOne(this)">${fa(n)} ★</button>`).join('')}</div>
  <span class="label">بی‌طرف بود؟</span><div class="chips"><button class="chip" aria-pressed="true" onclick="pickOne(this)">بله</button><button class="chip" aria-pressed="false" onclick="pickOne(this)">نه</button></div>
  <button class="cta" onclick="S.disp.find(x=>x.id==='${id}').arb.rated=1;closeSheet();renderDisp();toast('امتیاز ثبت شد')">ثبت امتیاز</button>`;show()}
(function(){const dc=dispClose;window.dispClose=function(id){dc(id);const d=S.disp.find(x=>x.id===id);d.st=4;renderDisp()}})();

/* ---------- سمت مهندس/متخصص: ثبت‌نام حل‌کننده و پرونده‌ها ---------- */
S.arbMe=null;S.arbEarn=0;
S.arbJobs=[{id:'j1',proj:'سقف دوم ویلای طولا',a:'noori',b:'tavakoli',field:'struct',issue:'ترک مویی سقف بعد از قالب‌برداری؛ کارفرما می‌گوید بتن‌ریزی عجولانه بوده.',place:'طولا',amt:180,when:'سه‌شنبه ۸ مهر · ۹ صبح',st:'new'},
  {id:'j2',proj:'کاشی‌کاری واحد ۴',a:'ahmadi',b:'rezaei',field:'fin',issue:'پوکی کاشی کف و اختلاف در متراژ.',place:'قشم',amt:40,when:'چهارشنبه ۹ مهر · ۱۱ صبح',st:'new'}];
function arbMyFields(){return ARB_F.filter(x=>x.who===S.role||(S.role==='engineer'&&x.k==='qty'))}
function openArbJ(){gate('arbj',()=>go('arbj'))}
function renderArbJ(){const m=S.arbMe,el=$('s-arbj'),can=['engineer','specialist'].includes(S.role);

function arbJoin(){const q=S.arbQ2;S.arbMe={st:'review',fields:q.fields.slice(),range:q.range};renderArbJ();
