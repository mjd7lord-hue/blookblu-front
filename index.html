<title>بلوک کاوش و اعتبار</title>
<style>@font-face{font-family:Vazirmatn;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/Vazirmatn-Regular.woff2) format('woff2')}@font-face{font-family:Vazirmatn;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/Vazirmatn-Medium.woff2) format('woff2')}@font-face{font-family:Vazirmatn;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/Vazirmatn-Bold.woff2) format('woff2')}@font-face{font-family:Vazirmatn;font-style:normal;font-weight:900;font-display:swap;src:url(fonts/Vazirmatn-Black.woff2) format('woff2')}</style><link rel="preload" href="fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{
  --night:#0B1412; --night-2:#132420; --steel:#1E4D45;
  --gold:#F97316; --gold-2:#FDBA74; --concrete:#B9C0CA; --concrete-2:#8E97A5;
  --bg:#E6E9EE; --surface:#FFFFFF; --ink:#152033; --muted:#5E6A7C; --line:#D3D9E1; --soft:#EEF1F5;
  --ok:#1F9463; --warn:#C8611F; --bad:#C63D3D;
  --r-worker:#0F766E; --r-specialist:#255E97; --r-engineer:#6845A5; --r-general:#D06A2A; --r-contractor:#0E7490; --r-company:#BE123C;
  --shadow:0 2px 4px rgba(11,20,18,.06),0 10px 28px rgba(11,20,18,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A1322;--surface:#142038;--ink:#EEF2F7;--muted:#9CA8BA;--line:#24324D;--soft:#1A2843;
  --r-worker:#2DD4BF;--r-specialist:#5C94F0;--r-engineer:#9C82F2;--r-general:#EE8B4B;--r-contractor:#34B6CA;--r-company:#EB6A8D;
  --ok:#2DD4BF;--warn:#EE8B4B;--bad:#F07070;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0A1322;--surface:#142038;--ink:#EEF2F7;--muted:#9CA8BA;--line:#24324D;--soft:#1A2843;
  --r-worker:#2DD4BF;--r-specialist:#5C94F0;--r-engineer:#9C82F2;--r-general:#EE8B4B;--r-contractor:#34B6CA;--r-company:#EB6A8D;
  --ok:#2DD4BF;--warn:#EE8B4B;--bad:#F07070;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden;direction:rtl}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}
h1,h2,h3,h4{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;position:relative;padding-bottom:110px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* screens */
.screen{display:none}
.screen.on{display:block;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(249,115,22,0)}100%{box-shadow:0 0 0 0 rgba(249,115,22,0)}}

.top{display:flex;align-items:center;gap:10px;padding:18px 16px 6px}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--night);color:var(--gold-2);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.top .hello{flex:1;min-width:0}
.top .hello b{display:block;font-size:19px}
.role-pill{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--muted);font-size:14px;min-height:28px}
.role-pill i{width:9px;height:9px;border-radius:50%}
.role-pill svg{width:14px;height:14px}
.icon-btn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:16px 16px 4px}
.bar h1{margin:0;font-size:20px;flex:1;line-height:1.4}

/* hero */
.hero{margin:10px 16px 0;border-radius:28px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 85% 0%,#16362F 0%,var(--night) 60%);padding:14px 14px 16px}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20% 18%,#ffffff88,transparent),radial-gradient(1px 1px at 55% 10%,#ffffff66,transparent),radial-gradient(1.5px 1.5px at 38% 34%,#ffffff55,transparent),radial-gradient(1px 1px at 80% 26%,#ffffff77,transparent)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.08);border-radius:16px;padding:4px}
.seg .ind{position:absolute;top:4px;bottom:4px;right:4px;width:calc((100% - 8px)/3);border-radius:12px;background:var(--gold);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg button{position:relative;z-index:1;border:0;background:none;color:#C9D1DC;font-size:13.5px;font-weight:700;min-height:44px;border-radius:12px;transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--night)}
.hero-head{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 6px 2px;position:relative}
.hero-head small{color:var(--concrete);font-size:13.5px;display:block}
.hero-head b{font-size:30px;font-weight:900;line-height:1.2}
.hero-head b span{font-size:15px;font-weight:500;color:var(--concrete);margin-right:6px}
.hero-head .legend-mini{display:flex;gap:10px;font-size:12px;color:var(--concrete)}
.island{position:relative;margin-top:4px}
.island svg{width:100%;height:auto}
.land{fill:#22375C;stroke:#35507F;stroke-width:1.2}
.main-land{fill:#1A2C4C}
.sea-line{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1;stroke-dasharray:3 5}
.place-lbl{font-size:8.5px;fill:#AFBACB;font-family:Vazirmatn,Tahoma,sans-serif}
.sonar{fill:none;stroke:var(--gold);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:sonar 2.8s ease-out infinite;opacity:0}
.sonar.s2{animation-delay:1.4s}
@keyframes sonar{0%{transform:scale(.2);opacity:.9}100%{transform:scale(5);opacity:0}}
.pin{cursor:pointer;transform-box:fill-box;transform-origin:center bottom;animation:drop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-26px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.pin circle.halo{opacity:.3}
.pin.sel circle.halo{opacity:.6;animation:halo 1.2s infinite}
@keyframes halo{50%{opacity:.15}}
.me-dot{fill:var(--gold)}

/* search */
.search{display:flex;gap:10px;margin:14px 16px 0}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);min-height:54px;border:1px solid transparent}
.sbox:focus-within{border-color:var(--gold)}
.sbox input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:15px}
.sbox svg{color:var(--muted);flex:none}
.fbtn{width:54px;height:54px;border-radius:16px;border:0;background:var(--night);color:var(--gold-2);display:grid;place-items:center;position:relative;flex:none}
.fbtn .badge{position:absolute;top:-4px;left:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--night);font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px}

.rail{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:6px 14px;min-height:44px;font-size:14.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .2s,color .2s,border-color .2s}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip small{color:var(--muted);font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:var(--gold-2)}
.chip[aria-pressed="true"] small{color:var(--concrete)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.section{padding:0 16px;margin-top:20px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px;gap:10px}
.sec-head h3{margin:0;font-size:17px}
.sec-head span,.sec-head button{color:var(--muted);font-size:13.5px;border:0;background:none;padding:0}
.sec-head button{min-height:40px}

/* suggestion rail */
.sugg{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.scard{flex:none;width:172px;border:0;text-align:right;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px;animation:up .4s both}
.scard b{font-size:15px;line-height:1.5}
.scard span{font-size:13px;color:var(--muted)}
.hex{width:48px;height:52px;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.week{display:flex;gap:4px;margin-top:2px}
.week i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.week i.a{background:var(--ok)}
.week i.b{background:var(--gold)}

/* ad card */
.acard{width:100%;border:0;text-align:right;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 14px 12px;margin-bottom:12px;display:block;position:relative;overflow:hidden;animation:up .4s both;transition:transform .15s,box-shadow .3s}
.acard:active{transform:scale(.98)}
.acard.flash{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
.acard .row1{display:flex;gap:12px;align-items:flex-start}
.acard .hex{width:44px;height:48px;font-size:14px}
.acard .tt{flex:1;min-width:0}
.acard h4{margin:0;font-size:16px;line-height:1.55}
.acard .who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.vbadge{width:15px;height:15px;color:var(--r-specialist);flex:none}
.type{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:16px;height:16px}
.meta b{color:var(--ink);font-weight:500}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.helmets{display:flex;gap:3px;align-items:center}
.helmets svg{width:22px;height:18px}
.helmet-f{fill:var(--gold)}
.helmet-e{fill:none;stroke:var(--concrete-2);stroke-width:1.5}
.helmets svg.pop{animation:pop .4s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.score-mini{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.score-mini svg{width:26px;height:26px;transform:rotate(-90deg)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;background:var(--surface);border-radius:22px}

/* map view */
.mapview{background:var(--night);border-radius:24px;padding:10px;position:relative}
.maptip{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:up .3s both}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:416px;margin:0 auto;background:var(--night);border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;position:relative;box-shadow:0 10px 30px rgba(11,20,18,.35)}
.nav-ind{position:absolute;top:6px;bottom:6px;width:calc((100% - 12px)/5);right:6px;border-radius:18px;background:rgba(249,115,22,.16);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.nav button{border:0;background:none;color:#98A5BC;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;min-height:56px;justify-content:center;position:relative;z-index:1}
.nav button[aria-current="page"]{color:var(--gold-2);font-weight:700}
.nav svg{width:23px;height:23px}
.nav .plus{background:var(--gold);color:var(--night);border-radius:18px;margin:2px 6px;min-height:52px}
.nav .plus svg{stroke-width:2.6;transition:transform .3s}
.nav .plus:active svg{transform:rotate(90deg)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1.05)}
.sheet.on{transform:none}
.sheet-in{max-width:440px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0;font-size:20px}
.sheet .sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.label{font-size:14px;color:var(--muted);margin:14px 0 8px;display:block}
.cta{width:100%;min-height:58px;border:0;border-radius:18px;background:var(--gold);color:var(--night);font-size:17px;font-weight:900;margin-top:16px;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.8s infinite}
@keyframes shine{60%,100%{left:120%}}
.cta:disabled{opacity:.45}
.cta:disabled::after{display:none}
.ghost{width:100%;min-height:52px;border:1px solid var(--line);border-radius:18px;background:none;font-size:15.5px;font-weight:700;margin-top:10px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:15.5px;outline:0;min-height:52px}
.field:focus{border-color:var(--gold)}
textarea.field{min-height:96px;resize:vertical;line-height:1.8}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--night);color:#fff;padding:10px 18px;border-radius:14px;font-size:14.5px;opacity:0;transition:.3s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ad detail */
.adhero{margin:8px 16px 0;border-radius:28px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 0%,#16362F 0%,var(--night) 60%);padding:18px 18px 14px}
.adhero .typebig{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.1)}
.adhero .typebig i{width:8px;height:8px;border-radius:50%}
.adhero h2{margin:10px 0 2px;font-size:22px;line-height:1.5;position:relative}
.adhero .when{font-size:13.5px;color:var(--concrete)}
.adhero .island{margin:6px -6px 0}
.adhero .range-lbl{position:absolute;left:18px;bottom:14px;font-size:12px;color:var(--concrete);background:rgba(11,20,18,.7);padding:3px 10px;border-radius:10px}
.ring-anim{fill:rgba(249,115,22,.1);stroke:var(--gold);stroke-width:1;stroke-dasharray:3 3;transform-box:fill-box;transform-origin:center;animation:grow 1.1s cubic-bezier(.3,1.2,.5,1) both}
@keyframes grow{from{transform:scale(0)}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.fact span{display:block;font-size:12.5px;color:var(--muted)}
.fact b{font-size:15.5px;font-weight:700}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.card p{margin:0}
.capacity{display:flex;align-items:center;gap:14px}
.capacity .helmets svg{width:34px;height:28px}
.stack{display:flex;flex-direction:row-reverse;justify-content:flex-end}
.stack span{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);margin-left:-10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.poster{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:right;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px}
.poster .t{flex:1;min-width:0}
.poster .t b{display:block;font-size:16px}
.poster .t span{font-size:13px;color:var(--muted)}
.ring-sc{position:relative;width:58px;height:58px;flex:none}
.ring-sc svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring-sc circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring-sc b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:900}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(200,97,31,.1);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:14px}
.note svg{flex:none;margin-top:2px}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:22;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.sticky-in{max-width:408px;margin:0 auto;display:flex;gap:10px}
.sticky .cta{margin:0;flex:1}
.sticky .sq{width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}

/* wizard */
.wiz-top{display:flex;align-items:center;gap:12px;padding:16px 16px 0}
.wiz-bld{width:46px;height:52px;display:flex;flex-direction:column-reverse;gap:3px;flex:none}
.wiz-bld span{height:14px;border-radius:4px;background:var(--line);transition:background .4s, transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:bottom}
.wiz-bld span.d{background:var(--steel)}
.wiz-bld span.n{background:var(--gold);animation:glow2 1.4s infinite}
@keyframes sw{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
@keyframes glow2{50%{opacity:.55}}
.wiz-top .t{flex:1}
.wiz-top small{color:var(--muted);font-size:13px}
.wiz-top h1{margin:0;font-size:20px;line-height:1.4}
.types{display:grid;gap:12px}
.tcard{display:flex;gap:14px;align-items:center;width:100%;border:2px solid transparent;text-align:right;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px;animation:up .4s both;transition:border-color .2s}
.tcard[aria-pressed="true"]{border-color:var(--gold)}
.tcard .ill{width:76px;height:76px;border-radius:18px;background:var(--night);flex:none;display:grid;place-items:center;overflow:hidden}
.tcard .ill svg{width:64px;height:64px}
.tcard b{display:block;font-size:17px}
.tcard span{font-size:13.5px;color:var(--muted)}
.rangebox{background:var(--night);border-radius:22px;padding:10px 10px 12px;color:#fff;position:relative}
.rangebox .reach{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.rangebox .reach b{font-size:22px;font-weight:900;color:var(--gold-2)}
.rangebox .reach span{font-size:13px;color:var(--concrete)}
.rng{fill:rgba(249,115,22,.14);stroke:var(--gold);stroke-width:1.2;transition:r .6s cubic-bezier(.3,1.3,.5,1)}
.preview-wrap{border:2px dashed var(--line);border-radius:26px;padding:10px}
.broadcast{display:grid;place-items:center;margin-top:10px}
.broadcast svg{width:180px;height:150px}
.wave{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;opacity:0;animation:wv 1.8s ease-out infinite}
.wave.w2{animation-delay:.3s}.wave.w3{animation-delay:.6s}
@keyframes wv{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.flow{display:flex;align-items:center;gap:6px;justify-content:center;margin:10px 0}
.flow span{font-size:13px;padding:6px 12px;border-radius:14px;background:var(--soft);color:var(--muted);transition:background .3s,color .3s}
.flow span.on{background:var(--ok);color:#fff}
.flow i{width:16px;height:2px;background:var(--line)}
.center{text-align:center}

/* profile */
.phero{margin:8px 16px 0;border-radius:28px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 0%,#16362F 0%,var(--night) 60%);padding:18px;display:grid;grid-template-columns:1fr 112px;gap:8px}
.phero .hex{width:64px;height:70px;font-size:20px}
.phero h2{margin:8px 0 0;font-size:21px;line-height:1.4;display:flex;align-items:center;gap:6px}
.phero h2 svg{width:20px;height:20px;color:#5EA8FF}
.phero .rl{font-size:14px;color:var(--concrete)}
.phero .loc{font-size:13px;color:var(--concrete);margin-top:6px;display:flex;align-items:center;gap:4px}
.phero .resp{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:rgba(31,148,99,.2);color:#99F6E4;padding:3px 10px;border-radius:20px}
.phero .resp i{width:7px;height:7px;border-radius:50%;background:#2DD4BF;animation:ping2 1.8s infinite}
@keyframes ping2{70%{box-shadow:0 0 0 7px rgba(60,194,143,0)}0%{box-shadow:0 0 0 0 rgba(60,194,143,.6)}}
.tower{border:0;background:none;padding:0;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center}
.tower svg{width:100px;height:150px}
.tower .blk{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.tower.go .blk{transform:none}
.tower b{font-size:24px;font-weight:900;line-height:1}
.tower small{font-size:12px;color:var(--concrete)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 8px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:900}
.stats span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--surface);border-radius:18px;padding:5px;box-shadow:var(--shadow);position:relative;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;border:0;background:none;border-radius:14px;min-height:44px;font-size:14px;white-space:nowrap;padding:0 10px;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--night);color:var(--gold-2);font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;border-radius:14px;padding:8px 0;background:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);min-height:66px;animation:up .35s both}
.day b{font-size:16px;color:var(--ink)}
.day.a{background:rgba(31,148,99,.14);color:var(--ok)}
.day.b{background:rgba(249,115,22,.18);color:#C2410C}
.day.o{opacity:.55}
:root[data-theme="dark"] .day.b{color:var(--gold-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day.b{color:var(--gold-2)}}
.day-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.day-legend span{display:inline-flex;align-items:center;gap:5px}
.day-legend i{width:10px;height:10px;border-radius:3px}
.skill{padding:12px 0}
.skill+.skill{border-top:1px solid var(--line)}
.skill .h{display:flex;justify-content:space-between;gap:10px}
.skill .h b{font-size:15.5px}
.skill .h span{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.skill .s{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.xpbar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;width:0;border-radius:6px;transition:width 1s cubic-bezier(.3,.8,.3,1)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf div{border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);animation:up .4s both}
.pf svg{width:100%;height:auto;background:var(--night)}
.pf p{margin:0;padding:8px 10px 10px;font-size:13.5px;line-height:1.5}
.pf p span{display:block;color:var(--muted);font-size:12px}
.rev{padding:12px 0}
.rev+.rev{border-top:1px solid var(--line)}
.rev .h{display:flex;justify-content:space-between;align-items:center}
.rev .h b{font-size:15px}
.rev .h span{font-size:12.5px;color:var(--muted)}
.starsr{display:flex;gap:2px;margin:2px 0 4px}
.starsr svg{width:15px;height:15px}
.rev p{font-size:14.5px}
.chain svg{width:100%;height:auto}
.chain-line{stroke:var(--gold);stroke-width:2;fill:none;stroke-dasharray:160;stroke-dashoffset:160;animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chain-node{animation:pop .45s cubic-bezier(.3,1.8,.5,1) both;transform-box:fill-box;transform-origin:center}
.need{display:flex;gap:12px;align-items:center;padding:10px 0}
.need+.need{border-top:1px solid var(--line)}

/* trust card */
.flip{perspective:1200px;margin:10px 16px 0;cursor:pointer}
.flip-in{position:relative;height:244px;transition:transform .8s cubic-bezier(.3,1.1,.4,1);transform-style:preserve-3d}
.flip.back .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#fff;padding:18px 20px;overflow:hidden;
  background:linear-gradient(135deg,#16362F 0%,#0B1412 55%,#0A1224 100%);box-shadow:0 20px 40px rgba(11,20,18,.35)}
.face.b{transform:rotateY(180deg)}
.face .pat{position:absolute;left:-30px;bottom:-40px;width:230px;height:230px;opacity:.16}
.face .shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 45%,transparent 60%);transform:translateX(-100%);animation:sweep 4s 1s infinite}
@keyframes sweep{30%,100%{transform:translateX(100%)}}
.face .brand{display:flex;justify-content:space-between;align-items:center;position:relative}
.face .brand b{font-size:18px;font-weight:900;letter-spacing:.5px}
.face .brand span{font-size:12px;color:var(--concrete)}
.face .code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:right;font-size:24px;letter-spacing:4px;margin-top:14px;color:var(--gold-2);position:relative}
.face .nm{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;position:relative}
.face .nm b{display:block;font-size:18px}
.face .nm span{font-size:13px;color:var(--concrete)}
.face .sc{text-align:center}
.face .sc b{font-size:30px;font-weight:900;color:var(--gold-2);line-height:1}
.face .sc span{font-size:12px}
.chipc{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#FDBA74,#C2410C);position:relative}
.chipc::before{content:"";position:absolute;inset:7px 11px;border:1.5px solid rgba(11,20,18,.45);border-radius:3px}
.bk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px;position:relative}
.bk-grid span{display:block;font-size:12px;color:var(--concrete)}
.bk-grid b{font-size:15px}
.flip-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px}
.brk{display:grid;gap:14px}
.brk .h{display:flex;justify-content:space-between;font-size:14.5px}
.brk .h b{font-variant-numeric:tabular-nums}
.bars{height:12px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:6px}
.bars i{display:block;height:100%;width:0;border-radius:7px;transition:width 1s cubic-bezier(.3,.8,.3,1)}
.hist{display:grid;gap:6px}
.hist div{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.hist i{display:block;height:8px;border-radius:5px;background:var(--gold);width:0;transition:width .9s cubic-bezier(.3,.8,.3,1)}
.hist span{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
details.guide{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:4px 16px}
details.guide summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;list-style:none}
details.guide summary::-webkit-details-marker{display:none}
details.guide p{font-size:14.5px;color:var(--muted);margin:0 0 12px}
.copy{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;min-height:40px;padding:0 12px;font-size:13px}

/* me */
.mecard{margin:10px 16px 0;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);padding:18px;display:flex;gap:16px;align-items:center}
.comp{position:relative;width:96px;height:96px;flex:none}
.comp svg{width:96px;height:96px;transform:rotate(-90deg)}
.comp circle{fill:none;stroke-width:9;stroke-linecap:round}
.comp b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:900}
.checklist{display:grid;gap:4px}
.ck{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;border:0;background:none;text-align:right;font-size:15px;min-height:48px}
.ck+.ck{border-top:1px solid var(--line)}
.ck .m{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.ck.d .m{background:var(--ok);border-color:var(--ok)}
.ck.d span.t{color:var(--muted)}
.ck span.t{flex:1}
.ck small{color:var(--gold);font-weight:700;font-size:12.5px}
.switch{display:flex;align-items:center;gap:12px}
.switch .t{flex:1}
.switch .t b{display:block;font-size:15.5px}
.switch .t span{font-size:13px;color:var(--muted)}
.tog{width:56px;height:32px;border-radius:20px;border:0;background:var(--line);position:relative;flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.5,.5,1);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tog[aria-checked="true"]{background:var(--ok)}
.tog[aria-checked="true"]::after{transform:translateX(-24px)}
.greq{display:flex;gap:12px;align-items:center;padding:12px 0;position:relative}
.greq+.greq{border-top:1px solid var(--line)}
.greq .t{flex:1;min-width:0}
.greq .t b{display:block;font-size:15px}
.greq .t span{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:8px}
.acts button{min-height:44px;border-radius:12px;padding:0 14px;font-size:14px;font-weight:700;border:1px solid var(--line);background:none}
.acts .yes{background:var(--ok);border-color:var(--ok);color:#fff}
.stamp{position:absolute;left:10px;top:50%;border:3px solid var(--ok);color:var(--ok);border-radius:10px;padding:2px 10px;font-weight:900;font-size:15px;transform:translateY(-50%) rotate(-12deg);animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both;background:var(--surface)}
.stamp.no{border-color:var(--bad);color:var(--bad)}
@keyframes stamp{from{transform:translateY(-50%) rotate(-12deg) scale(2.4);opacity:0}}
.tag{font-size:12.5px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.tag.ok{background:rgba(31,148,99,.14);color:var(--ok)}
.tag.wait{background:rgba(200,97,31,.14);color:var(--warn)}
.linkrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:right;min-height:56px;font-size:15.5px;padding:6px 0}
.linkrow+.linkrow{border-top:1px solid var(--line)}
.linkrow .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.linkrow span{flex:1}
.linkrow small{color:var(--muted)}
.okdraw{width:96px;height:96px;margin:6px auto 0}
.okdraw circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:280;stroke-dashoffset:280;animation:draw2 .7s ease forwards}
.okdraw path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw2 .4s .6s ease forwards}
@keyframes draw2{to{stroke-dashoffset:0}}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolebtn{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:92px;animation:up .35s both}
.rolebtn[aria-pressed="true"]{border-color:var(--gold)}
.rolebtn .hex{width:36px;height:40px;font-size:12px}
.rolebtn b{font-size:15px}

/* ===== HOME ===== */
.stories{display:flex;gap:14px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;flex:none;font-size:12px;color:var(--ink)}
.story .rim{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--gold),#FDBA74,var(--r-contractor),var(--gold))}
.story.seen .rim{background:var(--line)}
.story .in{width:100%;height:100%;border-radius:50%;background:var(--night);border:3px solid var(--bg);display:grid;place-items:center;color:var(--gold-2)}
.story .in svg{width:26px;height:26px}
.story span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.hcard{margin:14px 16px 0;border-radius:28px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 0%,#16362F 0%,var(--night) 60%);padding:18px}
.hcard small{color:var(--concrete);font-size:13.5px}
.hcard h2{margin:2px 0 0;font-size:20px;line-height:1.5}
.hcard .big{font-size:28px;font-weight:900;line-height:1.2}
.hcard .big span{font-size:14px;font-weight:500;color:var(--concrete);margin-right:4px}
.hcard .pillg{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:rgba(249,115,22,.16);color:var(--gold-2);padding:4px 10px;border-radius:20px;margin-top:6px}
.hcard .pillg i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.hcard .lnk{border:0;background:none;color:var(--gold-2);font-weight:700;font-size:14px;padding:0;min-height:40px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{border:0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;min-height:88px;transition:transform .15s;line-height:1.4}
.qa button:active{transform:scale(.94)}
.qa .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff}
.qa .ic svg{width:22px;height:22px}
/* worker shift */
.sky{width:100%;height:auto;margin-top:6px}
.punch{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;background:#E9E2CF;border-radius:14px;padding:10px 10px 8px;color:#3A3222;position:relative}
.punch::before{content:"کارت حضور · ۷ روز اخیر";position:absolute;top:-9px;right:12px;font-size:12px;background:#E9E2CF;padding:0 6px;border-radius:6px;color:#6B5F43}
.punch div{text-align:center;font-size:12px}
.punch i{display:block;width:18px;height:18px;border-radius:50%;margin:2px auto 0;border:1.5px dashed #9C8F6E}
.punch i.p{background:#0B1412;border:0;box-shadow:inset 0 0 0 3px #E9E2CF,0 0 0 1.5px #0B1412;animation:punch .4s cubic-bezier(.3,1.8,.5,1) both}
.punch i.t{border:2px solid var(--gold);animation:ping 1.8s infinite}
@keyframes punch{from{transform:scale(2.2);opacity:0}}
/* specialist toolbox */
.tb{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:end}
.tb svg{width:130px;height:130px}
.tb .lid{transform-box:fill-box;transform-origin:left bottom;animation:lid 1s .3s cubic-bezier(.3,1.4,.5,1) both}
@keyframes lid{from{transform:none}to{transform:translate(-4px,-10px) rotate(-7deg)}}
.tb .tool{transform-box:fill-box;transform-origin:bottom;animation:rise .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.demand{display:flex;align-items:flex-end;gap:6px;height:74px;margin-top:10px}
.demand div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--concrete);height:100%;justify-content:flex-end}
.demand i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.18);height:0;transition:height .9s cubic-bezier(.3,1.2,.5,1)}
.demand div.t i{background:var(--gold)}
.demand b{font-size:12px;color:#fff;font-weight:500}
/* engineer route */
.bp{background-color:#0F2E2A;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:18px 18px}
.route{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-dasharray:4 4}
.route-draw{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-dasharray:400;stroke-dashoffset:400;animation:rd 2.2s .3s ease forwards}
@keyframes rd{to{stroke-dashoffset:0}}
.visits{display:grid;gap:8px;margin-top:8px}
.visit{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:8px 10px;font-size:14px}
.visit .tm{background:var(--night);border-radius:10px;padding:2px 8px;font-weight:700;color:var(--gold-2);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.visit.now{background:rgba(249,115,22,.18)}
.visit.done{opacity:.55}
.visit span{flex:1}
.visit .tm{flex:none}
.site2 .bld{padding-left:12px}
.visit small{color:var(--concrete)}
/* contractor site */
.site2{display:grid;grid-template-columns:1fr 140px}
.site2 .bld svg{width:140px;height:230px}
.floor{transform-box:fill-box;transform-origin:center bottom;opacity:0;transform:translateY(-40px) scaleY(.6);transition:opacity .35s,transform .55s cubic-bezier(.3,1.4,.5,1)}
.floor.in{opacity:1;transform:none}
.floor.future rect.slab{fill:none;stroke:rgba(255,255,255,.25);stroke-dasharray:4 4}
.floor.done rect.slab{fill:var(--concrete)}
.floor.now rect.slab{fill:rgba(249,115,22,.18);stroke:var(--gold);stroke-width:1.5;animation:glowf 1.6s infinite}
@keyframes glowf{50%{fill:rgba(249,115,22,.4)}}
.win{fill:var(--night-2)}.floor.done .win.lit{fill:var(--gold-2)}
.hook{transform-box:view-box;transform-origin:58px 16px;animation:swing 3s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.crew{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.crew .av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;position:relative}
.crew .av.in::after{content:"";position:absolute;bottom:-3px;left:-3px;width:12px;height:12px;border-radius:50%;background:#2DD4BF;border:2px solid var(--night)}
.crew .av.out{opacity:.4}
.pdots{display:flex;gap:6px;margin-top:10px}
.pdots button{width:10px;height:10px;border-radius:10px;border:0;background:rgba(255,255,255,.3);padding:0;transition:width .3s,background .3s;position:relative}
.pdots button::after{content:"";position:absolute;inset:-14px -6px}
.pdots button[aria-current="true"]{width:26px;background:var(--gold)}
/* company skyline */
.sky2{width:100%;height:auto;margin-top:8px}
.sky2 .tw{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.3,1.2,.5,1)}
.sky2.go .tw{transform:none}
.sky2 g.b{cursor:pointer}
.sky2 g.b:focus-visible rect{stroke:var(--gold);stroke-width:2}
.tender{display:flex;gap:12px;align-items:center}
.cd{display:flex;gap:6px;direction:ltr}
.cd div{background:var(--night);color:var(--gold-2);border-radius:12px;min-width:48px;text-align:center;padding:6px 4px;line-height:1.2}
.cd b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.cd span{font-size:12px;color:var(--concrete)}
.cap{display:grid;gap:12px}
.cap .h{display:flex;justify-content:space-between;font-size:14.5px}
.cap .bars{height:12px}
/* client house */
.house{width:100%;height:auto}
.hp{opacity:0;transform-box:fill-box;transform-origin:bottom;transform:translateY(-18px)}
.hp.in{animation:hin .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes hin{to{opacity:1;transform:none}}
.hp.later{opacity:.22!important;animation:none;transform:none}
.stg-row{display:flex;gap:4px;margin-top:8px}
.stg-row i{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.2)}
.stg-row i.d{background:var(--concrete)}
.stg-row i.n{background:var(--gold);animation:blink 1.4s infinite}
.ask{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:8px 8px 8px 8px}
.ask input{flex:1;border:0;background:none;outline:0;font-size:16px;min-width:0;padding:8px}
.ask button{width:50px;height:50px;border-radius:16px;border:0;background:var(--gold);color:var(--night);display:grid;place-items:center;flex:none}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:right;padding:12px 0}
.offer+.offer{border-top:1px solid var(--line)}
.offer .hex{width:40px;height:44px;font-size:13px}
.offer b{display:block;font-size:15px}
.offer .pb{height:8px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
.offer .pb i{display:block;height:100%;width:0;border-radius:5px;transition:width 1s cubic-bezier(.3,.8,.3,1)}
.offer .pr{text-align:left;font-size:14px;font-weight:700;white-space:nowrap}
.offer .pr small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.best{font-size:12px;background:rgba(31,148,99,.14);color:var(--ok);padding:1px 8px;border-radius:10px;font-weight:700;margin-right:6px}
/* story viewer */
.sv{position:fixed;inset:0;z-index:60;background:#060C18;display:none;color:#fff}
.sv.on{display:block;animation:svIn .3s ease both}
@keyframes svIn{from{opacity:0;transform:scale(.94)}}
.sv-in{max-width:440px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sv-bars{display:flex;gap:4px}
.sv-bars span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.sv-bars i{display:block;height:100%;width:0;background:#fff}
.sv-bars span.d i{width:100%}
.sv-bars span.c i{animation:svp 5s linear forwards}
@keyframes svp{to{width:100%}}
.sv-top{display:flex;align-items:center;gap:10px;margin-top:12px}
.sv-top b{flex:1}
.sv-top button{border:0;background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:14px;font-size:22px}
.sv-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.sv-body svg{width:180px;height:180px;margin:0 auto}
.sv-body h2{margin:0;font-size:26px;line-height:1.5}
.sv-body p{margin:0;color:var(--concrete);font-size:16px}
.sv-tap{position:absolute;top:80px;bottom:120px;width:40%;border:0;background:none}
.sv-tap.n{left:0}.sv-tap.p{right:0}
.greet-sun{width:18px;height:18px;display:inline-block;vertical-align:-3px}

.bell-dot{position:absolute;top:10px;left:11px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(249,115,22,.6);animation:ping 2s infinite}
@keyframes spin2{to{transform:rotate(360deg)}}


/* ===== MESSAGES ===== */
.nav .nb{position:absolute;top:6px;left:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--night);font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 4px}
.inbox-hero{margin:10px 16px 0;border-radius:24px;background:var(--night);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.inbox-hero b{font-size:17px;display:block}
.inbox-hero span{font-size:13px;color:var(--concrete)}
.inbox-hero .t{flex:1}
.inbox-hero svg{width:64px;height:54px;flex:none}
.radio-w{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;opacity:0;animation:wv 1.8s ease-out infinite}
.crow{position:relative;border-radius:22px;overflow:hidden;margin-bottom:10px;background:var(--surface);box-shadow:var(--shadow);animation:up .35s both}
.cacts{position:absolute;inset:0 auto 0 0;display:flex;width:156px}
.cacts button{flex:1;border:0;color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cacts svg{width:20px;height:20px}
.citem{position:relative;z-index:1;width:100%;border:0;background:var(--surface);text-align:right;display:flex;gap:12px;align-items:center;padding:12px 14px;touch-action:pan-y;transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.citem.drag{transition:none}
.citem .av{position:relative;flex:none}
.citem .av .hex{width:48px;height:52px;font-size:14px}
.citem .on{position:absolute;bottom:2px;left:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface)}
.citem .t{flex:1;min-width:0}
.citem .r1{display:flex;align-items:center;gap:6px}
.citem .r1 b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .r1 time{margin-right:auto;font-size:12px;color:var(--muted);flex:none}
.citem .last{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.citem.unread .last{color:var(--ink);font-weight:500}
.citem .ctx{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--soft);color:var(--muted);border-radius:8px;padding:1px 8px;margin-top:3px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.citem .ctx i{width:7px;height:7px;border-radius:50%;flex:none}
.ubadge{min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--night);font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px;flex:none}
.mini-ic{width:14px;height:14px;color:var(--muted);flex:none}
.swipe-hint{text-align:center;font-size:12.5px;color:var(--muted);margin:2px 0 8px}

/* chat */
.chat-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:12px 12px 8px;display:flex;align-items:center;gap:10px}
.chat-top .who{flex:1;min-width:0;border:0;background:none;text-align:right;display:flex;align-items:center;gap:10px;padding:0}
.chat-top .who .hex{width:40px;height:44px;font-size:13px}
.chat-top .who b{display:flex;align-items:center;gap:4px;font-size:16px;white-space:nowrap;overflow:hidden}
.chat-top .who span{font-size:12.5px;color:var(--muted)}
.chat-top .who span.live{color:var(--ok)}
.ctxbar{margin:0 12px;background:var(--night);color:#fff;border-radius:20px;padding:10px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:14;box-shadow:0 8px 20px rgba(11,20,18,.2);border:0;width:calc(100% - 24px);text-align:right;display:block}
.ctxbar .r{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;gap:8px}
.ctxbar .r b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxbar .r small{color:var(--concrete);font-size:12px;flex:none}
.cstep{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.cstep div{font-size:12px;color:var(--concrete);text-align:center}
.cstep i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin-bottom:3px;transition:background .6s}
.cstep .d i{background:var(--ok)}
.cstep .n i{background:var(--gold);animation:blink 1.4s infinite}
.cstep .n{color:var(--gold-2);font-weight:700}
.msgs{padding:12px 12px 170px;display:flex;flex-direction:column;gap:6px}
.sys{align-self:center;max-width:88%;text-align:center;font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:5px 12px;margin:6px 0}
.dsep{align-self:center;font-size:12px;color:var(--muted);margin:8px 0 2px}
.bub{max-width:80%;padding:9px 13px 6px;border-radius:20px;font-size:15px;line-height:1.75;position:relative;animation:bIn .3s cubic-bezier(.3,1.4,.5,1) both;word-wrap:break-word}
@keyframes bIn{from{opacity:0;transform:translateY(8px) scale(.96)}}
.bub.them{align-self:flex-end;background:var(--surface);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(11,20,18,.06)}
.bub.me{align-self:flex-start;background:var(--night);color:#fff;border-bottom-right-radius:6px}
.bub .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:2px}
.bub.me .meta{color:var(--concrete)}
.tick{width:16px;height:12px}
.tick path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tick.read{color:var(--gold-2)}
.bub.card{padding:10px;width:80%;max-width:300px}
.bub.flagged{box-shadow:0 0 0 2px var(--bad)}
.flagnote{align-self:flex-end;max-width:86%;background:rgba(198,61,61,.1);color:var(--bad);border-radius:16px;padding:10px 12px;font-size:13.5px;display:grid;gap:8px;animation:bIn .35s .2s both}
.flagnote .acts button{min-height:38px;font-size:13px;border-color:rgba(198,61,61,.35);color:var(--bad)}
.filec{display:flex;align-items:center;gap:10px}
.filec .fi{width:42px;height:48px;border-radius:8px;background:var(--gold);color:var(--night);display:grid;place-items:center;font-size:12px;font-weight:900;flex:none;position:relative}
.filec .fi::after{content:"";position:absolute;top:0;left:0;border-style:solid;border-width:10px 10px 0 0;border-color:var(--bg) transparent transparent transparent}
.bub.me .filec .fi::after{border-color:var(--night) transparent transparent transparent}
.filec b{display:block;font-size:14px}
.filec span{font-size:12px;opacity:.7}
.photo{border-radius:14px;overflow:hidden;background:var(--night)}
.photo svg,.photo img{width:100%;display:block}
.photo-cap{font-size:13.5px;margin-top:6px}
.voice{display:flex;align-items:center;gap:10px;min-width:210px}
.voice .pl{width:40px;height:40px;border-radius:50%;border:0;background:var(--gold);color:var(--night);display:grid;place-items:center;flex:none}
.voice .pl svg{width:18px;height:18px;fill:currentColor}
.wf{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.wf i{flex:1;border-radius:2px;background:currentColor;opacity:.3;transition:opacity .15s}
.wf i.on{opacity:1;color:var(--gold)}
.bub.me .wf i.on{color:var(--gold-2)}
.voice small{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums;min-width:28px}
.locc{border-radius:14px;overflow:hidden;background:var(--night);padding:4px}
.locc-b{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.locc-b b{font-size:14px}
.locc-b span{font-size:12px;opacity:.7;display:block}
.mbtn{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;min-height:40px;padding:0 12px;font-size:13.5px;font-weight:700;flex:none}
.bub.me .mbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.deal h5{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--gold)}
.bub.me .deal h5{color:var(--gold-2)}
.deal dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px}
.deal dt{opacity:.65}
.deal dd{margin:0;font-weight:700}
.lock{height:64px;position:relative;margin:8px 0 2px}
.lock .h1,.lock .h2{position:absolute;top:8px;width:44px;height:48px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);transition:right .7s cubic-bezier(.3,1.4,.5,1),left .7s cubic-bezier(.3,1.4,.5,1)}
.lock .h1{right:8%}
.lock .h2{left:8%}
.lock .lk{position:absolute;left:50%;top:-4px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .45s .55s cubic-bezier(.3,1.8,.5,1);z-index:2}
.lock .lk svg{width:16px;height:16px}
.lock .ln{position:absolute;top:31px;right:calc(8% + 44px);left:calc(8% + 44px);border-top:2px dashed var(--line)}
.lock.done .h1{right:calc(50% - 42px)}
.lock.done .h2{left:calc(50% - 42px)}
.lock.done .lk{transform:scale(1)}
.lock.done .ln{opacity:0}
.deal .st{font-size:12.5px;font-weight:700;margin-top:6px}
.dayc{display:flex;gap:10px;align-items:center}
.dayc .cal{width:52px;border-radius:12px;overflow:hidden;text-align:center;flex:none;background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dayc .cal span{display:block;background:var(--gold);color:var(--night);font-size:12px;font-weight:700;padding:1px 0}
.dayc .cal b{font-size:20px;line-height:1.5;display:block}
.phonec{display:flex;align-items:center;gap:10px}
.phonec .pi{width:40px;height:40px;border-radius:12px;background:var(--ok);display:grid;place-items:center;color:#fff;flex:none}
.phonec b{direction:ltr;display:inline-block;font-size:16px;letter-spacing:.5px}
.typing{align-self:flex-end;background:var(--surface);border-radius:20px;border-bottom-left-radius:6px;padding:10px 14px;display:flex;align-items:flex-end;gap:4px;height:40px;animation:bIn .3s both}
.typing i{width:12px;height:7px;border-radius:2px;background:var(--gold);animation:brick 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s;background:var(--concrete-2)}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes brick{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
.typing span{font-size:12px;color:var(--muted);margin-right:6px;align-self:center}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:22;background:linear-gradient(to top,var(--bg) 78%,transparent);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.composer-in{max-width:416px;margin:0 auto}
.qr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.qr::-webkit-scrollbar{display:none}
.qr button{border:1px solid var(--line);background:var(--surface);border-radius:16px;min-height:38px;padding:0 12px;font-size:13.5px;white-space:nowrap;flex:none}
.cbar{display:flex;align-items:flex-end;gap:8px}
.cbar .att,.cbar .snd{width:50px;height:50px;border-radius:16px;border:0;display:grid;place-items:center;flex:none;touch-action:none}
.cbar .att{background:var(--surface);border:1px solid var(--line);transition:transform .3s}
.cbar .att.open{transform:rotate(45deg)}
.cbar .snd{background:var(--gold);color:var(--night);transition:transform .15s,background .2s}
.cbar .snd:active{transform:scale(.92)}
.cbar .snd.rec{background:var(--bad);color:#fff;transform:scale(1.12)}
.cbar .field-w{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:50px;display:flex;align-items:center;padding:0 14px}
.cbar textarea{flex:1;border:0;background:none;outline:0;resize:none;font-size:15.5px;max-height:110px;padding:12px 0;line-height:1.6}
.recbar{flex:1;display:flex;align-items:center;gap:10px;min-height:50px;background:var(--surface);border:1px solid var(--bad);border-radius:18px;padding:0 12px}
.recbar .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
.recbar .wf{height:26px;color:var(--bad)}
.recbar .wf i{opacity:.8;transition:height .12s}
.recbar small{font-variant-numeric:tabular-nums;font-weight:700}
.recbar button{border:0;background:none;color:var(--muted);font-size:13px;min-height:40px}
.attgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.attgrid button{border:0;background:var(--bg);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;min-height:96px;animation:up .3s both}
.attgrid .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff}
.attgrid .ic svg{width:22px;height:22px}
.ptoggle{display:grid;gap:14px}


/* ===== IRAN MAP ===== */
.pv{fill:#173029;stroke:#2B4A43;stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .4s}
.pv.cnt{fill:#F97316}
.pv.hl{fill:rgba(249,115,22,.3);stroke:#F97316;stroke-width:1.3}
.pv.all{fill:rgba(249,115,22,.22);stroke:rgba(249,115,22,.7)}
.ring-anim{vector-effect:non-scaling-stroke;fill:rgba(249,115,22,.3);stroke-width:1.6}
.prov-ring{fill:rgba(249,115,22,.28);stroke:#F97316;stroke-dasharray:none;stroke-width:1.5}
.pbub{cursor:pointer}
.pbub circle{fill:#F97316;stroke:#0E1917;stroke-width:1.5;vector-effect:non-scaling-stroke}
.pbub .bub-halo{opacity:.4;stroke:none;transform-box:fill-box;transform-origin:center;animation:bhalo 2.4s ease-out infinite}
@keyframes bhalo{0%{transform:scale(1);opacity:.45}100%{transform:scale(2);opacity:0}}
.pbub text{fill:#0B1412;font-weight:900;font-family:Vazirmatn,Tahoma,sans-serif}
.pbub .bub-in{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.8,.5,1) both}
.pbub:focus-visible circle{stroke:#fff;stroke-width:2.5}
.prov-lbl{fill:#E8ECF2;font-weight:700;font-family:Vazirmatn,Tahoma,sans-serif}
.hero .island svg{height:250px;width:100%}
.provx{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;min-height:34px;padding:0 12px;font-size:12.5px;font-family:inherit}
.mapcard{background:var(--hero,#0E1917);border-radius:20px;padding:8px;position:relative}
.mapcard .cap{position:absolute;right:16px;bottom:14px;color:#fff;font-size:13px;background:rgba(15,27,49,.8);padding:4px 10px;border-radius:10px}

/* ===== MODERN / MINIMAL LAYER ===== */
:root{--bg:#F3F4F6;--surface:#FFFFFF;--line:#E4E7EC;--soft:#F0F2F5;--muted:#6B7280;--ink:#101828;
  --shadow:0 1px 2px rgba(16,24,40,.04);--hero:#0E1917;--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B111C;--surface:#131B2A;--line:#1F2A3C;--soft:#182234;--muted:#8D98AA;--ink:#EDF1F7;--shadow:none;--hero:#16223A}}
:root[data-theme="dark"]{--bg:#0B111C;--surface:#131B2A;--line:#1F2A3C;--soft:#182234;--muted:#8D98AA;--ink:#EDF1F7;--shadow:none;--hero:#16223A}
body{letter-spacing:-.1px}
h1,h2,h3,h4,b{font-weight:700}
.stars{display:none}
/* surfaces: hairline instead of shadow */
.card,.acard,.scard,.fact,.poster,.stats div,.tcard,.pf div,.crow,.mecard,details.guide,.ask,.tabs,.empty{box-shadow:none!important;border:1px solid var(--line)}
.acard,.card,.scard,.poster,.crow,.tcard{border-radius:var(--r)}
.acard{padding:16px}
.acard .foot{border-top:1px solid var(--line)}
.acard h4{font-weight:700;font-size:15.5px}
.type{font-weight:500;font-size:12px;padding:2px 9px}
/* heroes: flat, calm */
.hero,.hcard,.adhero,.phero,.mapview,.inbox-hero{background:var(--hero)!important;border-radius:24px}
.hcard.bp{background-color:#0F2E2A!important;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px)!important;background-size:20px 20px!important}
.hero-head b,.hcard .big,.bigpct{font-weight:800;letter-spacing:-.5px}
.hcard h2,.adhero h2,.phero h2{font-weight:700;font-size:19px}
.pillg,.hcard .pillg{background:rgba(255,255,255,.08);color:#E8ECF2}
.seg{background:rgba(255,255,255,.06)}
/* header & icon buttons */
.top{padding:20px 16px 4px}
.top .hello b{font-size:20px;font-weight:800;letter-spacing:-.3px}
.avatar{border-radius:50%;width:44px;height:44px;font-size:16px}
.icon-btn{border:0;background:var(--surface);border-radius:50%;width:44px;height:44px}
.bar h1{font-weight:800;font-size:19px}
/* chips & inputs */
.chip{border:0;background:var(--surface);min-height:40px;font-size:14px;padding:6px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.sbox{box-shadow:none;border:1px solid var(--line);border-radius:16px;min-height:50px}
.fbtn{width:50px;height:50px;border-radius:16px;background:var(--ink);color:var(--bg)}
.fbtn .badge{background:var(--gold)}
.field{background:var(--surface);border-radius:14px}
/* CTA: flat */
.cta{border-radius:16px;min-height:54px;font-weight:800;font-size:16px;box-shadow:none}
.cta::after{display:none}
.ghost{border-radius:16px}
/* section rhythm */
.section{margin-top:26px}
.sec-head h3{font-size:16px;font-weight:700}
.sec-head span,.sec-head button{font-size:13px}
/* quick actions: bare tiles */
.qa{gap:6px}
.qa button{background:none;box-shadow:none;border:0;min-height:0;padding:4px 0;font-size:12.5px;color:var(--ink)}
.qa .ic{--c:var(--gold);width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.qa .ic svg{width:24px;height:24px}
.attgrid .ic{--c:var(--gold);background:color-mix(in srgb,var(--c) 14%,var(--surface))!important;color:var(--c)}
.attgrid button{background:var(--soft)}
/* stories: thin ring */
.story .rim{width:62px;height:62px;padding:2px;background:var(--gold)}
.story.seen .rim{background:var(--line)}
.story .in{border-width:2px;background:var(--hero)}
.story span{color:var(--muted);font-size:12px}
/* nav: floating glass */
.nav-in{background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 8px 24px rgba(16,24,40,.08);border-radius:26px}
.nav button{color:var(--muted);font-size:12px;min-height:54px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav-ind{background:var(--soft)}
.nav .plus{background:var(--ink);color:var(--bg);border-radius:50%;width:52px;height:52px;min-height:52px;margin:1px auto}
.nav .nb{background:var(--bad);color:#fff}
/* misc */
.tabs{background:var(--soft);border:0}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.days .day{border-radius:14px}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.ubadge{background:var(--ink);color:var(--bg)}
.citem{padding:14px}
.sticky{background:linear-gradient(to top,var(--bg) 75%,transparent)}
.sticky .sq{border-radius:16px;border:1px solid var(--line)}
.bub.me{background:var(--ink);color:var(--bg)}
.bub.me .meta{color:inherit;opacity:.6}
.bub.them{box-shadow:none;border:1px solid var(--line)}
.ctxbar{background:var(--hero);box-shadow:none}
.composer .field-w,.cbar .att{border-color:var(--line)}
.cbar .snd{background:var(--ink);color:var(--bg)}
.toast{border-radius:12px;background:var(--ink);color:var(--bg)}
.sheet-in{border-radius:24px 24px 0 0}
.note{border-radius:14px}


/* ===== BLOCK BRAND COLORS (رنگ‌های بلوک قبلی) ===== */
:root{--night:#0B1412;--night-2:#132420;--steel:#1E4D45;--gold:#F97316;--gold-2:#FDBA74;--accent:#0F766E;--accent-2:#0F9C88;
  --bg:#F4EFE4;--surface:#FBF8F0;--soft:#EFE7D6;--line:#E2D7BE;--ink:#0F172A;--muted:#6B6154;--hero:#0E1917;
  --ok:#0F766E;--warn:#C2410C;--bad:#C0392B;
  --r-worker:#0F766E;--r-specialist:#255E97;--r-engineer:#6845A5;--r-general:#F97316;--r-contractor:#0E7490;--r-company:#BE123C;
  --concrete:#A9BDB8;--concrete-2:#7E938E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1412;--surface:#111E1B;--soft:#132420;--line:#1E2E2B;--ink:#EAF3F1;--muted:#9BB0AC;--hero:#0E1917;--accent:#0F9C88;
  --ok:#2DD4BF;--warn:#FB923C;--bad:#FF6B6B;--r-worker:#0F9C88;--r-specialist:#5EA8FF;--r-engineer:#A98CFF;--r-general:#F97316;--r-contractor:#22D3EE;--r-company:#FB7185;--hero:#132822}}
:root[data-theme="dark"]{--bg:#0B1412;--surface:#111E1B;--soft:#132420;--line:#1E2E2B;--ink:#EAF3F1;--muted:#9BB0AC;--hero:#0E1917;--accent:#0F9C88;
  --ok:#2DD4BF;--warn:#FB923C;--bad:#FF6B6B;--r-worker:#0F9C88;--r-specialist:#5EA8FF;--r-engineer:#A98CFF;--r-general:#F97316;--r-contractor:#22D3EE;--r-company:#FB7185}
.hero,.hcard,.adhero,.phero,.mapview,.inbox-hero,.mapcard,.rangebox,.ctxbar{background:var(--hero)!important}
.hcard.bp{background-color:#0F2E2A!important}
.cta{background:var(--accent);color:#fff}
.nav .plus{background:var(--accent);color:#fff}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.fbtn{background:var(--accent);color:#fff}
.seg .ind{background:var(--accent)}
.seg button[aria-pressed="true"]{color:#fff}
.nav button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-selected="true"]{color:var(--accent)}
.story .rim{background:linear-gradient(135deg,var(--accent-2),var(--gold))}
.sbox:focus-within,.field:focus{border-color:var(--accent)}
.bub.me{background:var(--accent);color:#fff}
.cbar .snd{background:var(--accent);color:#fff}
.ubadge{background:var(--gold);color:#fff}
.tog[aria-checked="true"]{background:var(--accent)}
.fbtn .badge{background:var(--gold);color:#fff}
:root[data-theme="dark"]{--hero:#132822}
.avatar{background:var(--accent);color:#fff}
.hero,.hcard,.adhero,.phero,.inbox-hero,.mapcard{border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}



/* ===== شناسنامهٔ کاری (کارت پروفایل جدید) ===== */
.flip-in{height:388px}
.face.sb{background:var(--surface)!important;color:var(--ink);border:1px solid var(--line);padding:0;box-shadow:0 10px 30px rgba(11,20,18,.10)}
.sb-head{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:12px 16px;border-radius:25px 25px 0 0}
.sb-head b{display:block;font-size:16px;line-height:1.3}
.sb-head small{font-size:12px;opacity:.85}
.sb-head>div{flex:1}
.sb-logo svg{width:30px;height:33px}
.sb-role{font-size:12px;font-weight:700;background:#fff;color:var(--c);padding:3px 10px;border-radius:20px}
.sb-id{display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
.sb-id .hex{width:52px;height:56px;font-size:16px}
.sb-nm{flex:1;min-width:0}
.sb-nm b{display:block;font-size:17px;line-height:1.4}
.sb-nm span{font-size:12.5px;color:var(--muted)}
.sb-seal{text-align:center;flex:none}
.sb-seal svg{width:54px;height:54px;background:var(--soft);border-radius:10px;padding:4px;display:block}
.sb-seal code{display:block;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;color:var(--muted);margin-top:2px}
.sb-rows{display:grid;grid-template-columns:1fr 1fr;margin:4px 16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sb-rows div{padding:7px 10px;border-bottom:1px solid var(--line)}
.sb-rows div:nth-child(odd){border-left:1px solid var(--line)}
.sb-rows div:nth-last-child(-n+2){border-bottom:0}
.sb-rows span{display:block;font-size:12px;color:var(--muted)}
.sb-rows b{font-size:13.5px}
.sb-score{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.bricks{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,14px);gap:3px;direction:ltr;transform:scaleY(-1)}
.bricks i{background:var(--soft);border-radius:2px;display:block}
.bricks i.on{background:var(--line)}
.bricks i.on.in{background:var(--gold);animation:lay .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes lay{from{transform:translateY(14px) scale(.6);opacity:0}}
.sb-n{text-align:center;flex:none}
.sb-n b{display:block;font-size:28px;font-weight:900;line-height:1;color:var(--accent)}
.sb-n span{font-size:12px;color:var(--muted)}
.stamp2{position:absolute;left:80px;top:54px;width:74px;height:74px;color:var(--ok);opacity:0;transform:rotate(-14deg) scale(2);pointer-events:none}
.stamp2.no{color:var(--warn)}
.stamp2.in{animation:stamp3 .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp3{to{opacity:.85;transform:rotate(-14deg) scale(1)}}
.stamp2 svg{width:100%;height:100%}
.stamp2 text{direction:ltr!important;unicode-bidi:normal!important}
.face.bp2{background-color:#0F2E2A!important;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px)!important;background-size:16px 16px!important;padding:18px}
.bp-head{display:flex;justify-content:space-between;align-items:center}
.bp-head b{font-size:17px}
.bp-rows{margin-top:14px;display:grid;gap:12px}
.bp-rows div{display:flex;align-items:center;gap:8px;font-size:14px}
.bp-rows span{color:#A9BDB8;font-size:12.5px;flex:none}
.bp-rows i{flex:1;height:0;border-top:1px dashed rgba(169,189,184,.5);position:relative}
.bp-rows i::before,.bp-rows i::after{content:"";position:absolute;top:-4px;width:1px;height:7px;background:rgba(169,189,184,.7)}
.bp-rows i::before{right:0}.bp-rows i::after{left:0}
.bp-rows b{flex:none}
.bp-foot{position:absolute;left:18px;right:18px;bottom:14px;font-size:12px;color:#A9BDB8;border-top:1px solid rgba(255,255,255,.15);padding-top:8px}


/* ===== CONCEPT ANIMATIONS v2 ===== */
.screen.on.fwd{animation:enterF .34s cubic-bezier(.2,.8,.3,1) both}
.screen.on.bwd{animation:enterB .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes enterF{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes enterB{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
/* شناسنامه: اسکن مهر رقمی */
.seal-w{position:relative;display:block;overflow:hidden;border-radius:10px}
.seal-w::after{content:"";position:absolute;left:0;right:0;height:3px;top:0;background:var(--accent);box-shadow:0 0 10px 2px var(--accent);opacity:0;animation:scan 1.3s .15s ease-in-out both}
@keyframes scan{0%{top:0;opacity:1}90%{top:calc(100% - 3px);opacity:1}100%{top:calc(100% - 3px);opacity:0}}
.sb-seal svg rect{transform-box:fill-box;transform-origin:center;animation:cellIn .3s cubic-bezier(.3,1.7,.5,1) both}
@keyframes cellIn{from{transform:scale(0);opacity:0}}
.sb-seal code.ok{color:var(--ok);font-weight:700}
.sb-seal code.ok::after{content:" ✓"}
.sb-rows div{animation:tile .45s cubic-bezier(.3,1.3,.5,1) both;transform-origin:top center}
.sb-rows div:nth-child(1){animation-delay:.25s}.sb-rows div:nth-child(2){animation-delay:.35s}.sb-rows div:nth-child(3){animation-delay:.45s}.sb-rows div:nth-child(4){animation-delay:.55s}
@keyframes tile{from{transform:perspective(400px) rotateX(-80deg);opacity:0}}
.flip.nudge:not(.back) .flip-in{animation:nudge .95s ease-in-out}
@keyframes nudge{0%,100%{transform:rotateY(0)}35%{transform:rotateY(-16deg)}65%{transform:rotateY(6deg)}}
.flip.back .bp-rows i{animation:dim .5s ease both;transform-origin:right}
.flip.back .bp-rows div:nth-child(2) i{animation-delay:.1s}.flip.back .bp-rows div:nth-child(3) i{animation-delay:.2s}.flip.back .bp-rows div:nth-child(4) i{animation-delay:.3s}.flip.back .bp-rows div:nth-child(5) i{animation-delay:.4s}
@keyframes dim{from{transform:scaleX(0)}}
.flip.back .bp-rows b{animation:fadeV .4s .35s both}
@keyframes fadeV{from{opacity:0;transform:translateY(4px)}}
/* نقشه: امواج ارسال اعلان از محل آگهی */
.bcast{fill:none;stroke:var(--gold);stroke-width:1.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;opacity:0;animation:bcast 2.4s ease-out infinite}
@keyframes bcast{0%{transform:scale(.3);opacity:.9}100%{transform:scale(4);opacity:0}}
/* کاوش: زمین خالی با مخروط */
.empty.lot svg{width:180px;height:auto;margin:0 auto 8px;display:block}
.empty.lot .cone{transform-box:fill-box;transform-origin:bottom;animation:cone 1.6s ease-in-out infinite}
@keyframes cone{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
/* پروفایل: امروز */
.day.today{box-shadow:0 0 0 2px var(--accent);animation:up .35s both,todayP 2.2s 1s ease-in-out infinite}
@keyframes todayP{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}}
/* نمونه‌کار: چراغ پنجره‌ها روشن می‌شود */
.pf svg rect[fill="#FDBA74"]{animation:lit 3s ease-in-out infinite}
.pf svg rect[fill="#FDBA74"]:nth-of-type(3n){animation-delay:.8s}.pf svg rect[fill="#FDBA74"]:nth-of-type(3n+1){animation-delay:1.6s}
@keyframes lit{0%,100%{opacity:1}50%{opacity:.25}}
/* پیام: پرواز دکمهٔ ارسال و پرش شمارنده */
.cbar .snd.fly svg{animation:fly .55s ease both}
@keyframes fly{0%{transform:none}45%{transform:translate(-26px,-22px) rotate(-20deg);opacity:0}46%{transform:translate(14px,10px);opacity:0}100%{transform:none;opacity:1}}
.nav .nb.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
/* میان‌برها: واکنش لمسی */
.qa .ic.tap{animation:tapB .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes tapB{0%{transform:scale(1)}30%{transform:scale(.82) rotate(-6deg)}100%{transform:scale(1)}}
.chip:active,.mbtn:active,.icon-btn:active{transform:scale(.94)}
/* استوری: حلقهٔ چرخان برای ندیده‌ها */
.story .rim{position:relative;background:none!important}
.story .rim::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--accent-2),var(--gold),var(--accent-2));animation:spin2 3.5s linear infinite}
.story.seen .rim::before{background:var(--line);animation:none}
.story .in{position:relative}


/* ===== پشت شناسنامه (کارنامه) ===== */
.face.cb{background:var(--hero)!important;color:#fff;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.cb-top{display:flex;justify-content:space-between;align-items:flex-start}
.cb-top small{display:block;font-size:12px;color:var(--concrete)}
.cb-top b{font-size:17px}
.cb-code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;font-size:12px;background:rgba(255,255,255,.08);padding:3px 8px;border-radius:8px;color:var(--gold-2)}
.skyline{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:84px;align-items:end;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:0}
.skyline div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.skyline i{display:block;width:100%;height:var(--h);border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--accent-2) 70%,#fff 0%);opacity:.85;
  background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px);background-size:100% 6px;transform-origin:bottom;transform:scaleY(0)}
.skyline .now i{background-color:var(--gold);opacity:1}
.skyline span{position:absolute;bottom:-17px;font-size:9.5px;color:var(--concrete);white-space:nowrap}
.flip.back .skyline i{animation:rise2 .6s cubic-bezier(.3,1.3,.5,1) forwards;animation-delay:var(--d)}
@keyframes rise2{to{transform:scaleY(1)}}
.cb-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cb-tiles>div{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px}
.cb-tiles small{display:block;font-size:12px;color:var(--concrete)}
.cb-tiles b{font-size:13.5px}
.ti{width:32px;height:32px;border-radius:10px;background:rgba(15,156,136,.22);display:grid;place-items:center;flex:none;color:#5EEAD4}
.ti svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ti.lock{background:rgba(249,115,22,.2);color:var(--gold-2)}
.cb-contact{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px;font-size:12.5px;margin-top:auto}
.cb-contact>span:not(.ti),.cb-contact b{flex:1}
.copy2{border:0;background:var(--gold);color:#fff;border-radius:10px;min-height:36px;padding:0 12px;font-weight:700;font-size:13px;font-family:inherit;flex:none}
.flip.back .cb-tiles>div{animation:fadeV .4s both}
.flip.back .cb-tiles>div:nth-child(2){animation-delay:.08s}.flip.back .cb-tiles>div:nth-child(3){animation-delay:.16s}.flip.back .cb-tiles>div:nth-child(4){animation-delay:.24s}

/* ===== ROUND 5: guest, auth, requests, calendar, projects, notifications, settings ===== */
.login-btn{border:0;background:var(--accent);color:#fff;border-radius:14px;min-height:44px;padding:0 16px;font-weight:700;font-size:14px;flex:none;font-family:inherit}
.gate-art{display:grid;place-items:center;margin:4px 0 6px}
.gate-art svg{width:120px;height:90px}
.gate-art polygon{transform-box:fill-box;transform-origin:center;animation:drop2 .5s cubic-bezier(.3,1.6,.5,1) both}
.gate-art .g2{animation-delay:.12s}.gate-art .g3{animation-delay:.24s}
.gate-art .key{transform-origin:60px 28px;animation:keyT 1.2s .5s ease-in-out both}
@keyframes drop2{from{transform:translateY(-30px);opacity:0}}
@keyframes keyT{0%{transform:rotate(0)}40%{transform:rotate(-35deg)}100%{transform:rotate(0)}}
.gate-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.gate-list li{display:flex;gap:8px;align-items:center;font-size:14px;background:var(--soft);border-radius:12px;padding:9px 12px}
.gate-list li::before{content:"✓";color:var(--accent);font-weight:900}
/* guest home */
.ghero{position:relative;overflow:hidden}
.gh-hex{position:absolute;left:-10px;top:-10px;width:160px;height:160px;opacity:.5;pointer-events:none}
.gh-hex i{position:absolute;width:34px;height:38px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--accent-2);opacity:.35;animation:float2 6s ease-in-out infinite;animation-delay:calc(var(--i)*-0.8s)}
.gh-hex i:nth-child(2n){background:var(--gold);opacity:.3}
@keyframes float2{50%{transform:translateY(-10px) rotate(8deg)}}
.gh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative}
.gh-stats div{background:rgba(255,255,255,.07);border-radius:14px;padding:8px;text-align:center}
.gh-stats b{display:block;font-size:22px;font-weight:900;color:var(--gold-2)}
.gh-stats span{font-size:12px;color:var(--concrete)}
.gmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gmodes button{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-family:inherit;color:var(--ink);animation:up .4s both}
.gmodes .ic{--c:var(--gold);width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.gmodes b{font-size:13.5px}.gmodes small{font-size:12px;color:var(--muted)}
.guest-cta{text-align:center}.guest-cta b{font-size:17px}.guest-cta p{color:var(--muted);font-size:14px;margin:6px 0 0}
.locked{text-align:center;padding:24px 18px}
.locked b{font-size:18px;display:block}.locked p{color:var(--muted);font-size:14.5px;margin:6px 0 0}
.lock-art svg{width:80px;height:80px;margin:0 auto 8px;display:block}
.lock-art .shackle{animation:shk 2.4s ease-in-out infinite}
@keyframes shk{0%,60%,100%{transform:none}70%{transform:translateY(-5px)}80%{transform:none}}
/* ad cards: chat button */
.acard{cursor:pointer}
.ac-chat{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:12px;min-height:34px;padding:0 10px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.ac-chat svg{width:15px;height:15px}
.chatbtn{flex:none;min-height:58px;border-radius:16px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-family:inherit}
.chatbtn svg{width:20px;height:20px}
/* auth */
.auth-top{padding:16px 16px 0}
.auth-hero{text-align:center;padding:10px 24px 0}
.auth-hero h1{font-size:24px;margin:8px 0 4px}.auth-hero p{color:var(--muted);margin:0;font-size:15px}
.auth-hero.small{padding-top:4px}
.auth-hexes{width:120px;height:120px;margin:0 auto;display:block}
.auth-hexes polygon{fill:var(--hero);stroke:var(--bg);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:drop2 .55s cubic-bezier(.3,1.5,.5,1) both}
.auth-hexes polygon:nth-child(2){animation-delay:.12s}.auth-hexes polygon:nth-child(3){animation-delay:.24s;fill:var(--gold)}.auth-hexes polygon:nth-child(4){animation-delay:.36s;fill:var(--accent)}
.phone-in{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;direction:ltr}
.phone-in:focus-within{border-color:var(--accent)}
.phone-in span{padding:0 12px;font-size:20px;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}
.phone-in input{flex:1;border:0;outline:0;background:none;font-size:22px;padding:14px 12px;letter-spacing:2px;font-family:inherit;min-width:0}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--muted)}
.agree input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:3px}
.agree a{color:var(--accent);font-weight:700}
.sms svg{width:90px;height:70px;margin:0 auto;display:block}
.sms .flap{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s .2s ease forwards}
.sms{animation:up .4s both}
.otp{display:flex;gap:10px;justify-content:center;margin-top:6px}
.otp input{width:54px;height:62px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:center;font-size:26px;font-weight:900;outline:0;font-family:inherit;transition:border-color .2s,transform .2s}
.otp input:focus{border-color:var(--accent);transform:translateY(-2px)}
.otp.good input{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));animation:okP .4s both}
.otp.good input:nth-child(2){animation-delay:.05s}.otp.good input:nth-child(3){animation-delay:.1s}.otp.good input:nth-child(4){animation-delay:.15s}.otp.good input:nth-child(5){animation-delay:.2s}
@keyframes okP{50%{transform:translateY(-6px)}}
.otp.bad{animation:shake .4s}
.otp.bad input{border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lnk2{border:0;background:none;color:var(--accent);font-weight:700;font-family:inherit;font-size:14px;min-height:40px}
.rolepick{display:grid;gap:10px}
