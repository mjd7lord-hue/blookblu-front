.rolepick button{--c:var(--accent);display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;text-align:right;font-family:inherit;color:var(--ink);animation:up .4s both;transition:border-color .2s,transform .15s}
.rolepick button:active{transform:scale(.98);border-color:var(--c)}
.rp-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.rolepick b{display:block;font-size:16px}.rolepick small{font-size:13px;color:var(--muted)}
.rolepick>button>div{flex:1}
.rp-n{font-size:12px;color:var(--muted);background:var(--soft);border-radius:10px;padding:2px 8px;flex:none}
.reg-bld{display:flex;flex-direction:column-reverse;gap:3px;width:40px;flex:none}
.reg-bld span{height:8px;border-radius:3px;background:var(--line);transition:background .4s}
.reg-bld span.d{background:var(--accent)}
.reg-bld span.n{background:var(--gold);animation:glow2 1.4s infinite}
.reg-sub{margin:8px 20px 0;color:var(--muted);font-size:14px}
.reg-form .rf{animation:up .35s both;margin-bottom:4px}
.reg-form .rf:nth-child(2){animation-delay:.05s}.reg-form .rf:nth-child(3){animation-delay:.1s}.reg-form .rf:nth-child(4){animation-delay:.15s}.reg-form .rf:nth-child(5){animation-delay:.2s}
.opt{font-size:12px;color:var(--muted);font-weight:500;background:var(--soft);border-radius:8px;padding:1px 6px}
.numf{display:flex;align-items:center;gap:8px}.numf .field{flex:1}.numf span{color:var(--muted);font-size:14px;flex:none}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:18px 50%,12px 50%;background-size:6px 6px;background-repeat:no-repeat}
.regsw{padding:10px 0;border-bottom:1px solid var(--line)}
.upl{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--muted);font-size:14px;background:var(--surface)}
.upl.has{border-style:solid;border-color:var(--ok);color:var(--ink)}
.upl-ic,.upl-ok{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);flex:none}
.upl-ok{background:var(--ok);color:#fff}.upl-ok svg{width:18px;height:18px}
.done-bld{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;height:170px;justify-content:flex-start;position:relative;width:120px;margin:0 auto}
.done-bld span{width:110px;height:24px;border-radius:5px;background:var(--accent);opacity:0;animation:stack .45s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--k)*.22s);
  background-image:linear-gradient(90deg,transparent 14px,rgba(255,255,255,.55) 14px 24px,transparent 24px 44px,rgba(255,255,255,.55) 44px 54px,transparent 54px 74px,rgba(255,255,255,.55) 74px 84px,transparent 84px);background-size:100% 10px;background-repeat:no-repeat;background-position:0 7px}
.done-bld span:nth-child(odd){background-color:var(--accent-2)}
.done-bld .flag{width:4px;height:36px;background:var(--muted);position:relative;opacity:0;animation:stack .4s 1.4s forwards}
.done-bld .flag::after{content:"";position:absolute;top:0;left:4px;width:26px;height:16px;background:var(--gold);transform-origin:left;animation:wave2 1s 1.8s ease-in-out infinite}
@keyframes stack{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
@keyframes wave2{50%{transform:skewY(10deg) scaleX(.85)}}
/* requests */
.tbadge{background:var(--gold);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-right:4px}
.rq{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;animation:up .35s both;transition:opacity .3s}
.rq.closed{opacity:.75}
.rq-h{display:flex;align-items:center;gap:10px}
.rq-h .hex{width:40px;height:44px;font-size:13px}
.rq-h .t{flex:1;min-width:0}.rq-h b{display:block;font-size:15px}.rq-h .t span{font-size:13px;color:var(--muted)}
.rq-a{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.rq-a button{min-height:40px;border-radius:12px;border:1px solid var(--line);background:none;padding:0 14px;font-weight:700;font-size:13.5px;font-family:inherit;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.rq-a .yes{background:var(--accent);border-color:var(--accent);color:#fff}
/* calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cal-h b{font-size:17px}.cal-h span{font-size:13px;color:var(--muted)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w span{font-size:12px;color:var(--muted);padding:4px 0}
.cd2{position:relative;border:0;background:none;border-radius:12px;min-height:44px;font-family:inherit;color:var(--ink);font-size:15px;transition:background .2s,transform .15s}
.cd2:active{transform:scale(.9)}
.cd2 i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.cd2.past{color:var(--muted);opacity:.55}
.cd2.av-a{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:700}
.cd2.av-b{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.cd2.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd2.sel{background:var(--accent)!important;color:#fff!important;animation:selP .35s cubic-bezier(.3,1.6,.5,1)}
.cd2.sel i{background:#fff}
@keyframes selP{from{transform:scale(.7)}}
.evc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;animation:up .35s both}
.evc .tm{background:var(--hero);color:var(--gold-2);border-radius:10px;padding:4px 8px;font-weight:700;flex:none}
.evc .t{flex:1}.evc b{display:block;font-size:15px}.evc .t span{font-size:13px;color:var(--muted)}
.evc .icon-btn{width:40px;height:40px}.evc .icon-btn.on{background:var(--accent);color:#fff}
.evc .icon-btn.on svg{animation:ringB .6s}
/* projects */
.pj{width:100%;display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:10px;text-align:right;font-family:inherit;color:var(--ink);animation:up .35s both}
.pj-b{display:flex;flex-direction:column-reverse;gap:3px;width:34px;flex:none}
.pj-b span{height:10px;border-radius:3px;background:var(--line)}
.pj-b span.d{background:var(--accent)}.pj-b span.n{background:var(--gold);animation:glow2 1.4s infinite}
.pj .t{flex:1;min-width:0}.pj b{display:block;font-size:15px}.pj .t span{display:block;font-size:13px;color:var(--muted)}
.pj em{font-style:normal;font-size:12px;font-weight:700;color:var(--gold)}.pj em.ok{color:var(--ok)}
.pj-r{font-weight:900;color:var(--gold);flex:none}
.pstep{display:flex;align-items:center;margin:14px 0 6px}
.pstep>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);flex:none;width:58px}
.pstep i{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.pstep i svg{width:16px;height:16px}
.pstep .d i{background:var(--accent);border-color:var(--accent);color:#fff}
.pstep .n i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 0 rgba(249,115,22,.5);animation:ping 1.8s infinite}
.pstep .d span{color:var(--ink);font-weight:700}
.pstep>b{flex:1;height:2px;background:var(--line);margin-bottom:18px}
.rate{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.rate button{border:0;background:none;padding:4px}
.rate svg{width:40px;height:40px}
.rate button.on{animation:pop .35s cubic-bezier(.3,1.8,.5,1) both}
/* notifications */
.nhero{display:flex;align-items:center;gap:12px;background:var(--hero);color:#fff;border-radius:20px;padding:14px 16px}
.nhero b{display:block;font-size:16px}.nhero span{font-size:13px;color:var(--concrete)}
.bellw{width:44px;height:44px;border-radius:14px;background:rgba(249,115,22,.2);color:var(--gold-2);display:grid;place-items:center;flex:none}
.bellw svg{width:24px;height:24px}
.bellw.ring svg{transform-origin:50% 10%;animation:ringB 2.2s ease-in-out infinite}
@keyframes ringB{0%,50%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(10deg)}40%{transform:rotate(-6deg)}}
.nt{width:100%;display:flex;gap:12px;align-items:flex-start;border:0;background:none;text-align:right;padding:12px 0;font-family:inherit;color:var(--ink);position:relative}
.nt+.nt{border-top:1px solid var(--line)}
.nt .t{flex:1}.nt b{display:block;font-size:15px}.nt .t>span{display:block;font-size:13.5px;color:var(--muted)}.nt small{font-size:12px;color:var(--muted)}
.nt.un b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:middle}
.nt-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--accent)}
.nt-ic svg{width:20px;height:20px}
.ty-req{color:var(--gold)}.ty-msg{color:var(--r-specialist)}.ty-star{color:var(--gold)}.ty-cal{color:var(--r-engineer)}.ty-id{color:var(--ok)}
/* settings */
.seg2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);border-radius:16px;padding:5px}
.seg2 button{border:0;background:none;border-radius:12px;min-height:44px;font-family:inherit;font-size:14px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.legal{padding-right:20px;margin:6px 0 0;display:grid;gap:10px;font-size:14.5px;line-height:1.9}
.faq{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.faq p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.mygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mygrid button{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-family:inherit;color:var(--ink);animation:up .35s both}
.mygrid .ic{--c:var(--accent);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.mygrid .ic svg{width:22px;height:22px}
.mygrid em{position:absolute;top:8px;left:10px;font-style:normal;background:var(--gold);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:12px;display:grid;place-items:center;padding:0 5px}

.comp b{white-space:nowrap;display:flex!important;align-items:center;justify-content:center}

/* ===== ROUND 6 ===== */
.skel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;display:grid;gap:10px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--soft) 25%,color-mix(in srgb,var(--soft) 40%,var(--surface)) 50%,var(--soft) 75%);background-size:200% 100%;animation:shim 1.1s linear infinite}
.skel .s1{width:70%;height:16px}.skel .s2{width:45%}.skel .s3{width:90%}
@keyframes shim{to{background-position:-200% 0}}
.ma{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;animation:up .35s both}
.ma-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ma-h small{color:var(--muted);font-size:12px}
.ma>b{font-size:15.5px;display:block;line-height:1.6}
.ma-s{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
.ma-s>span{display:inline-flex;align-items:center;gap:4px}.ma-s b{color:var(--ink)}
.spark{margin-right:auto;display:flex!important;align-items:flex-end;gap:2px;height:26px;width:60px}
.spark i{flex:1;background:var(--accent);opacity:.7;border-radius:2px 2px 0 0;transform-origin:bottom;animation:rise2 .5s cubic-bezier(.3,1.3,.5,1) both;transform:scaleY(0)}
.spark i:last-child{background:var(--gold);opacity:1}
.ma-a{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ma-a button{min-height:38px;border-radius:12px;border:1px solid var(--line);background:none;padding:0 12px;font-weight:700;font-size:13px;font-family:inherit;color:var(--ink)}
.ma-a .yes{background:var(--accent);border-color:var(--accent);color:#fff}
.rs{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.rs-h{display:flex;align-items:center;gap:10px}.rs-h .hex{width:40px;height:44px;font-size:13px}.rs-h .t{flex:1}.rs-h b{display:flex;align-items:center;gap:4px;font-size:15px}.rs-h .t span{font-size:12.5px;color:var(--muted)}
.rs-w{font-weight:700;font-size:13px;color:var(--accent)}
.rs p{margin:8px 0 0;font-size:14.5px}
.bm-art{display:block;margin:0 auto 6px}.bm-art path{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1s .2s forwards}
.avup{display:inline-block;position:relative;cursor:pointer}
.avup .hex{margin:0 auto}
.avcam{position:absolute;bottom:2px;left:-4px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}
.avcam svg{width:16px;height:16px}
.lockf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lockf span{display:block;font-size:12px;color:var(--muted)}.lockf b{font-size:15px}
.lockf p{grid-column:1/-1;margin:0;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.rate-ed{border:0;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border-radius:10px;padding:2px 10px;font-weight:700;font-size:13.5px;font-family:inherit;min-height:34px}
.rate-in{display:flex;gap:6px;align-items:center;max-width:60%}
.pfhint{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:14px;padding:10px 14px;font-size:13.5px}
.pfhint b{color:var(--accent);flex:none}
.pf2 div{cursor:pointer}.pf2 img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.pf-add{border:2px dashed var(--line);background:none;border-radius:18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-family:inherit;font-size:14px}
.pf-add span{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.pfbig{border-radius:16px;overflow:hidden;background:var(--hero)}.pfbig svg,.pfbig img{width:100%;display:block}
.gq h2{font-size:18px}.gq-art{width:100%;height:auto;margin:6px 0}.gq-p{margin:0;font-size:13.5px;color:var(--concrete);position:relative}
.mycode{display:flex;align-items:center;gap:10px}.mycode>div{flex:1}.mycode small{display:block;font-size:12px;color:var(--muted)}.mycode b{font-size:22px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent)}
.rolepick button.act{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.rolepick button.act .rp-n{background:var(--c);color:#fff}
.shield-h{display:flex;align-items:center;gap:14px;background:var(--hero);color:#fff;border-radius:20px;padding:16px}
.shield-h b{display:block;font-size:17px}.shield-h span{font-size:13px;color:var(--concrete)}
.sh-art svg{width:60px;height:68px;flex:none}
.sh-ck{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s .3s forwards}
.sh-art{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.svc{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14.5px}.svc+.svc{border-top:1px solid var(--line)}
.svc small{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.dot.ok{background:var(--ok);box-shadow:0 0 0 0 rgba(15,118,110,.5);animation:ping2 2s infinite}.dot.slow{background:var(--gold)}
.offbar{position:fixed;top:0;left:0;right:0;z-index:70;background:#3A2A12;color:#FDBA74;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-size:13.5px;transform:translateY(-110%);transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
.offbar.on{transform:none}.offbar span{flex:1}
.offbar button{border:1px solid rgba(253,186,116,.5);background:none;color:inherit;border-radius:10px;min-height:36px;padding:0 10px;font-family:inherit;font-size:13px}
.splash2{position:fixed;inset:0;z-index:90;background:var(--hero);display:grid;place-items:center;color:#fff;text-align:center;transition:opacity .5s,visibility .6s}

.est-hero{display:flex;gap:12px;align-items:flex-end;min-height:190px}

.cmp thead .hex{width:38px;height:42px;font-size:12px;margin:0 auto 4px}
.cmp thead b{display:block;font-size:13px;line-height:1.5}
.cmp thead em{display:inline-block;font-style:normal;font-size:12px;background:var(--gold);color:#fff;border-radius:8px;padding:1px 8px;margin-top:4px}
.cmp td.cbest{background:rgba(31,148,99,.1);font-weight:800;color:var(--ok)}
.cmp td small{color:var(--muted);font-size:12px}
.cmp td.msg{font-size:12.5px;line-height:1.8;color:var(--muted);text-align:right}
.cmp td .mini{margin:2px;min-height:32px;padding:0 8px;width:calc(100% - 4px)}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.docs-hero,.disp-hero{display:flex;gap:14px;align-items:center}
.docs-hero p,.disp-hero p{margin:4px 0 0;color:var(--concrete);font-size:13px;line-height:1.8}
.shield{width:70px;flex:none}
.shf{animation:shRise 1.2s cubic-bezier(.2,.8,.2,1) both}
.shw{animation:shWave 2.6s linear infinite}
@keyframes shRise{from{transform:translateY(70px)}}
@keyframes shWave{to{transform:translateX(60px)}}
.shk{transition:opacity .4s}
.doc-row{animation:fadeUp .35s both;flex-wrap:wrap}
.doc-row .nt-ic.d-ok{color:var(--ok)}
.doc-row .nt-ic.d-none{color:var(--muted)}
.doc-row .nt-ic.d-rev{color:var(--warn)}
.expbar{height:5px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden;max-width:180px}
.expbar i{display:block;height:100%;width:var(--w);transform-origin:right;animation:grow .7s both}
.scale{width:92px;flex:none}
.scale .beam{transform-origin:50px 16px;animation:tilt 4s ease-in-out infinite}
.scale .pan{animation:untilt 4s ease-in-out infinite}
.scale .pan.l{transform-origin:16px 16px}.scale .pan.r{transform-origin:84px 16px}
@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes untilt{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
.dcase{margin-bottom:10px}
.how{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;line-height:1.9}
.how i{width:26px;height:26px;flex:none;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.disp-link{margin-top:8px;background:var(--surface);border-radius:16px;padding:0 16px!important;border:1px solid var(--line)}


/* ===== ROUND 11: بازدید · ایمنی · ارتقا ===== */
.vis-hero{display:flex;gap:12px;align-items:center}
.vis-hero .hex{width:48px;height:54px;font-size:15px}
.vis-hero p{margin:2px 0 0;color:var(--concrete);font-size:13px}
.road{width:110px;flex:none}
.road .rd{fill:none;stroke:rgba(255,255,255,.35);stroke-width:2;stroke-dasharray:4 5}
.road .car{offset-path:path("M4 40 C30 40 40 12 70 16 S104 34 114 14");offset-rotate:auto;animation:drive 3.6s ease-in-out infinite}
@keyframes drive{0%{offset-distance:0%}70%,100%{offset-distance:92%}}
.vtypes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vtypes button,.vdays button,.vslots button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;font-family:inherit;color:var(--ink);cursor:pointer;transition:.2s}
.vtypes button{padding:10px;text-align:right;display:flex;flex-direction:column;gap:2px;min-height:64px}
.vtypes b{font-size:13.5px;line-height:1.6}.vtypes span{font-size:12px;color:var(--muted)}
.vtypes button[aria-pressed="true"],.vdays button[aria-pressed="true"],.vslots button[aria-pressed="true"]{border-color:var(--accent);background:rgba(15,118,110,.08);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.vdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.vdays button{padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.vdays small{font-size:12px;color:var(--muted)}.vdays b{font-size:17px}
.vdays i{width:6px;height:6px;border-radius:50%;margin-top:3px}
.vdays i.a,.vleg i.a{background:var(--ok)}.vdays i.b,.vleg i.b{background:var(--warn)}.vdays i.o,.vleg i.o{background:var(--line)}
.vdays button:disabled,.vslots button:disabled{opacity:.45;cursor:not-allowed}
.vleg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.vleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px}
.vslots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vslots button{min-height:48px;font-size:15px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center}
.vslots small{font-size:12px;font-weight:500;color:var(--muted)}
.ticket{display:grid;gap:8px;border:1.5px dashed var(--line);border-radius:14px;padding:12px;position:relative}
.ticket div{display:flex;justify-content:space-between;gap:8px;font-size:14px}.ticket small{color:var(--muted)}
.vsum.ready .ticket{border-color:var(--accent);animation:tkt .5s both}
@keyframes tkt{from{transform:scale(.97)}}
.vsum .cta:disabled{opacity:.5}
.vdone svg{width:120px;display:block;margin:6px auto}
.vdone .ck{stroke-dasharray:60;stroke-dashoffset:60;animation:sign .6s .2s ease-out forwards}
.vis-link{display:flex;align-items:center;gap:12px;width:100%;border:0;font-family:inherit;color:var(--ink)}
.vis-link span:not(.nt-ic){font-size:13px;color:var(--muted)}
.vis-link .arr{font-size:20px;color:var(--accent)!important}
.safe-hero{display:flex;gap:12px;align-items:center}
.gauge{width:120px;flex:none;position:relative}
.gauge b{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:15px;color:#fff}
.gv{animation:gv 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gv{from{stroke-dasharray:0 100}}
.streak{display:inline-flex;gap:6px;margin-top:8px;background:rgba(31,148,99,.18);color:#6EE7B7;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700}
.sfrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;font-family:inherit;color:var(--ink);text-align:right;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.sfrow:last-child{border-bottom:0}
.sfrow .bx{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;transition:.2s}
.sfrow .bx svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s}
.sfrow.on .bx{background:var(--ok);border-color:var(--ok);transform:scale(1.05)}
.sfrow.on .bx svg{stroke-dashoffset:0}
.sfrow.on span:last-child{color:var(--muted)}
.bst-prev{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bp{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.bp i{width:26px;height:26px;border-radius:8px;background:var(--line);flex:none}
.bp span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp.o{animation:bpDown .7s cubic-bezier(.2,.8,.2,1) both .3s}
.bp.me{order:-1;background:var(--surface);color:var(--ink);font-weight:700;border:1.5px solid var(--c);box-shadow:0 6px 16px rgba(0,0,0,.08);animation:bpUp .7s cubic-bezier(.2,.8,.2,1) both .3s}
.bp.me i{background:var(--c)}
.bp.me em{font-style:normal;font-size:12px;background:var(--c);color:#fff;border-radius:8px;padding:1px 8px}
.bp.me.star{background:linear-gradient(90deg,rgba(249,115,22,.1),transparent)}
@keyframes bpUp{from{transform:translateY(140px)}}
@keyframes bpDown{from{transform:translateY(-40px)}}
.bplans{display:flex;flex-direction:column;gap:8px}
.bplans button{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;font-family:inherit;color:var(--ink);cursor:pointer}
.bplans button small{display:block;color:var(--muted);font-size:12px;font-weight:500;line-height:1.7}
.bplans .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;transition:.2s}
.bplans button[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.bplans button[aria-pressed="true"] .dot{border:6px solid var(--c)}
.bst-stat{display:flex;text-align:center}
.bst-stat div{flex:1}.bst-stat b{display:block;font-size:17px;color:var(--accent)}.bst-stat small{font-size:12px;color:var(--muted)}


/* ===== ROUND 12: صورت‌وضعیت · آمار · آکادمی ===== */
.sov-hero{display:flex;gap:12px;align-items:center}
.sov-hero h2{color:var(--gold-2)}
.sov-hero p{margin:4px 0 0;color:var(--concrete);font-size:13px}
.sov-ring{width:84px;flex:none;position:relative;text-align:center}
.sov-ring svg{width:84px}
.sov-ring b{position:absolute;top:28px;left:0;right:0;color:#fff;font-size:15px}
.sov-ring small{font-size:12px;color:var(--concrete)}
.sov-row{margin-bottom:8px;padding:12px 14px;animation:fadeUp .35s both}
.sr-h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.sr-h span{font-size:12px;color:var(--muted);white-space:nowrap}
.sr-bar{height:10px;border-radius:5px;background:var(--soft);display:flex;overflow:hidden;margin:8px 0}
.sr-bar i{height:100%;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.sr-bar .pv,.sr-leg .pv{background:var(--concrete-2,#94A3B8)}
.sr-bar .nw,.sr-leg .nw{background:var(--gold)}
.sr-f{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sr-f>span{flex:1}.sr-f>b{color:var(--gold);font-size:13.5px}
.sr-st{display:flex;gap:4px}
.sr-st button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;font-family:inherit;cursor:pointer}
.sr-leg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.sr-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.sov-net{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:10px!important;font-size:15px}
.sov-net b{color:var(--accent);font-size:17px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;animation:fadeUp .35s both}
.kpi small{color:var(--muted);font-size:12.5px}.kpi b{font-size:20px}
.kpi span{font-size:12px;font-weight:700}.kpi .up{color:var(--ok)}.kpi .dn{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.bars>div{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bars b{font-size:12px;color:var(--muted)}
.bars i{width:100%;max-width:34px;height:var(--h);border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--accent) 35%,transparent);transform-origin:bottom;animation:barUp .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*80ms)}
.bars i.cur{background:var(--accent)}
.bars small,.bars-x small{font-size:12px;color:var(--muted)}
@keyframes barUp{from{transform:scaleY(0)}}
.line{width:100%;height:auto;display:block}
.line text{font-size:12px;fill:var(--gold);font-weight:800}
.ln{stroke-dasharray:600;stroke-dashoffset:600;animation:lnDraw 1.4s ease-out forwards}
@keyframes lnDraw{to{stroke-dashoffset:0}}
.bars-x{display:flex;justify-content:space-between;padding:0 2px}
.hbar{flex:1.4;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.hbar i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:4px;transform-origin:right;animation:grow .7s both;animation-delay:calc(var(--k)*100ms)}
.dots{display:flex;gap:6px;align-items:flex-end}
.dots>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.dcol{display:flex;flex-direction:column-reverse;gap:3px;min-height:110px;justify-content:flex-start}
.dcol i{width:14px;height:6px;border-radius:2px;background:var(--gold);animation:pop .25s both}
.learn-hero{display:flex;gap:12px;align-items:center}
.learn-hero p{margin:4px 0 0;color:var(--concrete);font-size:13px}
.books{width:78px;height:74px;flex:none;position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:3px}
.books i{width:calc(62px - var(--i)*6px);height:10px;border-radius:3px;background:var(--r-specialist);opacity:calc(1 - var(--i)*.12);animation:estUp .45s both;animation-delay:calc(var(--i)*120ms)}
.books i:nth-child(2n){background:var(--gold)}
.books .cap{position:absolute;top:0;width:34px;height:10px;background:var(--accent-2,#2DD4BF);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:capB 2.6s ease-in-out infinite}
@keyframes capB{50%{transform:translateY(-4px) rotate(-6deg)}}
.course{display:flex;align-items:center;gap:12px;margin-bottom:8px;animation:fadeUp .35s both}
.course b{display:block;font-size:14.5px}.course small{display:block;font-size:12px;color:var(--muted)}
.cz-ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--r-specialist);flex:none}
.cz-ic.fin{color:var(--ok);background:rgba(31,148,99,.12)}
.lvid{height:150px;border-radius:16px;background:radial-gradient(120% 90% at 85% 0%,#16362F 0%,var(--night) 60%);position:relative;display:grid;place-items:center;margin-bottom:12px;overflow:hidden}
.lvid .play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.15);position:relative;animation:pulse 1.8s infinite}
.lvid .play::after{content:'';position:absolute;inset:0;margin:auto;left:4px;width:0;height:0;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #fff}
.lprog{position:absolute;bottom:10px;left:12px;right:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.lprog i{display:block;height:100%;width:0;background:var(--gold);border-radius:2px;animation:lprog 6s linear forwards}
@keyframes lprog{to{width:100%}}


/* ===== ROUND 13: ویرایش کارگاه ===== */
.se-edit{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:12px;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;z-index:2;transition:background .2s}
.se-edit:hover{background:rgba(255,255,255,.22)}
.se-edit svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.se-meta{display:block;margin-top:6px;color:var(--concrete);font-size:12.5px}
.pdots .se-add{width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;line-height:18px;display:grid;place-items:center;margin-top:-4px}
.se-prev{display:flex;gap:14px;align-items:center;background:radial-gradient(120% 90% at 85% 0%,#16362F 0%,var(--night) 60%);border-radius:18px;padding:10px 14px;color:#fff}
.se-prev svg{width:74px;height:auto;flex:none}
.se-prev>div{flex:1}
.se-prev small{color:var(--concrete);font-size:12.5px}
.se-prev b{display:block;font-size:17px;color:var(--gold-2)}
.se-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.se-bar i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.se-stg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.se-stg button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-family:inherit;color:var(--ink);font-size:13.5px;cursor:pointer;text-align:right}
.se-stg i{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:var(--soft);color:var(--muted)}
.se-stg .d i{background:var(--accent);color:#fff}
.se-stg .d{color:var(--muted)}
.se-stg .n{border-color:var(--gold);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.se-stg .n i{background:var(--gold);color:#fff}


/* ===== ROUND 14: انیمیشن کارگاه متصل ===== */
.dsite{width:140px;height:230px;overflow:visible}
.se-prev .dsite{width:74px;height:auto}
.dsf{animation:dsIn .5s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center bottom}
@keyframes dsIn{from{opacity:0;transform:translateY(-14px)}}
.ds-cur{animation:dsPulse 1.4s ease-in-out infinite}
@keyframes dsPulse{50%{opacity:.45}}
.ds-grow{transform-box:fill-box;transform-origin:center bottom;animation:dsGrow 2.4s ease-in-out infinite}
@keyframes dsGrow{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}
.ds-flow{animation:dsFlow 1s linear infinite}
@keyframes dsFlow{to{stroke-dashoffset:-14}}
.ds-lit{animation:dsLit 2.6s ease-in-out infinite}
@keyframes dsLit{50%{opacity:.55}}
.ds-dig{transform-box:fill-box;transform-origin:0 0;animation:dsDig 1.6s ease-in-out infinite}
@keyframes dsDig{50%{transform:rotate(18deg) translateY(4px)}}
.ds-fall{animation:dsFall 1.8s ease-in infinite}
@keyframes dsFall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(96px);opacity:.2}}
.ds-tile{animation:pop .3s both}
.ds-tag{font-size:12px;fill:var(--gold-2);font-weight:800;font-family:Vazirmatn,Tahoma}
.se-bar2{max-width:170px;margin-top:6px}
.se-step{margin-top:10px;align-self:flex-start;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:6px 12px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.se-step:active{transform:scale(.96)}
.se-dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.se-dots button{width:26px;height:10px;border-radius:5px;border:0;background:var(--soft);cursor:pointer;padding:0}
.se-dots .d{background:var(--accent)}.se-dots .n{background:var(--gold)}
.se-prev small.num{display:block;margin-top:4px}


/* ===== ROUND 16: توافق چت ← قرارداد ===== */
.dl-acts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dl-ctr{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--accent);background:rgba(15,118,110,.08);color:var(--accent);border-radius:12px;padding:10px 12px;font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;text-align:start}
.dl-ctr span{flex:1}
.dl-ctr.s0{animation:dlPulse 2s ease-in-out infinite}
.dl-ctr.s1{border-color:var(--gold);color:var(--gold);background:rgba(249,115,22,.08)}
.dl-ctr.s2{border-color:var(--ok);color:var(--ok);background:rgba(31,148,99,.1)}
@keyframes dlPulse{50%{box-shadow:0 0 0 5px rgba(15,118,110,.15)}}
.bub.me .dl-ctr{background:#fff;border-color:#fff;color:var(--accent)}.bub.me .dl-ctr.s1{color:var(--gold)}.bub.me .dl-ctr.s2{color:var(--ok)}.bub.me .dl-prj{color:rgba(255,255,255,.85)}
.ctr-msg i{font-style:normal;font-weight:700;color:var(--ink)}
.dl-prj{border:0;background:none;color:var(--muted);font-family:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:2px}
.ctr-msg{display:flex;gap:12px;align-items:center;margin:10px auto;max-width:92%;background:var(--surface);border:1.5px solid rgba(31,148,99,.4);border-radius:18px;padding:12px 14px;animation:fadeUp .4s both}
.ctr-msg b{display:block;font-size:14.5px;color:var(--ok)}
.ctr-msg span{display:block;font-size:12.5px;color:var(--muted);line-height:1.8}
.ctr-msg button{margin-top:6px;border:0;background:none;color:var(--accent);font-family:inherit;font-weight:800;font-size:13px;padding:0;cursor:pointer}
.cm-seal{width:58px;height:58px;flex:none;border-radius:50%;border:3px double #C2410C;color:#C2410C;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);animation:stampIn .5s cubic-bezier(.3,1.6,.5,1) both .2s}
.cm-seal b{color:#C2410C!important;font-size:13px!important}.cm-seal small{font-size:9.5px}


/* ===== ROUND 17: مراحل پرداخت انتخابی ===== */
.pe-plans{display:flex;flex-wrap:wrap;gap:6px}
.pe-bar{display:flex;gap:3px;height:10px;margin:12px 0 4px;border-radius:5px;overflow:hidden;background:var(--soft)}
.pe-bar i{background:var(--accent);transition:flex .35s cubic-bezier(.2,.8,.2,1);min-width:0}

/* ===== ROUND 18: کاوش استانی + حالت‌های رنگی ===== */

.pv-list button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-family:inherit;color:var(--ink);cursor:pointer;text-align:start;font-size:13.5px}

/* خانهٔ مهمان: کارت‌های سه حالت رنگی‌تر */
.gmodes button:nth-child(1){--mc:var(--m-work)}.gmodes button:nth-child(2){--mc:var(--m-job)}.gmodes button:nth-child(3){--mc:var(--m-q)}

/* پرسش تخصصی: فاصلهٔ دکمهٔ «پاسخ می‌دهم» از کادرها */

/* ===== ROUND 19: نوار سه‌حالته بیرون از کارت نقشه ===== */

:root[data-en] .etl-axis span{transform:translateX(50%) scaleX(-1)}
:root[data-en] .etl-now em{transform:translateX(-50%) scaleX(-1)}
.ed-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ed-stats button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:14px;padding:10px 4px;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}

.hold{position:relative;margin-bottom:10px;overflow:hidden;animation:fadeUp .35s both}

.hd-ph{display:flex;align-items:center;gap:6px;margin:10px 0 8px}
.hd-ph i{width:44px;height:34px;border-radius:9px;background:linear-gradient(135deg,#475569,#1E293B);display:grid;place-items:center;animation:pop .3s both;animation-delay:calc(var(--k)*70ms)}

.eh-n{overflow:visible}
.eh-n .eh-hex{overflow:visible}

.eh-n small{color:rgba(255,255,255,.55);font-size:12px}

.eh-n.on b{color:var(--c)}
.eh-n.on::before{content:'';position:absolute;top:-6px;width:60px;height:64px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%);z-index:-1;animation:pulse 2s infinite}
.elane.in{animation:fadeUp .35s both}

.ejob{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.el-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.el-stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}

/* ===== ROUND 27: خورشید/ماه، تغییر نرم پوسته، پاپ ذخیره ===== */
.thico{overflow:visible}
.thico .th-sun,.thico .th-moon,.thico .th-rays,.thico .th-moon path{transform-box:view-box;transform-origin:12px 12px}
.thico .th-rays path{transform-box:fill-box;transform-origin:50% 100%}
.thico .th-sun,.thico .th-moon{transition:transform .6s cubic-bezier(.3,1.4,.5,1),opacity .35s}
.thico .th-sun{opacity:1;transform:none}

.thico .th-moon path:first-child{fill:currentColor;fill-opacity:.12}
.thico .th-star{opacity:0}

:root[data-theme="dark"] .thico .th-moon{opacity:1;transform:none}
:root[data-theme="dark"] .thico .th-star{opacity:1}

.thico .th-sun circle{fill:currentColor;fill-opacity:.15}
/* هنگام تغییر: پرتوهای خورشید یکی‌یکی بیرون می‌آیند و می‌چرخند؛ ماه تاب می‌خورد و ستاره‌ها چشمک می‌زنند */
:root.th-anim:not([data-theme="dark"]) .thico .th-rays path{animation:thRay .5s calc(.15s + var(--i)*.04s) cubic-bezier(.3,1.6,.5,1) both}
:root.th-anim:not([data-theme="dark"]) .thico .th-rays{animation:thSpin .9s cubic-bezier(.2,.8,.3,1) both}
:root.th-anim[data-theme="dark"] .thico .th-moon path:first-child{animation:thSwing .8s cubic-bezier(.3,1.5,.5,1) both}
:root.th-anim[data-theme="dark"] .thico .th-star.s1{animation:thTw .5s .35s both}
:root.th-anim[data-theme="dark"] .thico .th-star.s2{animation:thTw .5s .5s both}
@keyframes thRay{from{opacity:0;transform:scale(.2)}}
@keyframes thSpin{from{transform:rotate(-90deg)}}
@keyframes thSwing{0%{transform:rotate(-40deg)}60%{transform:rotate(12deg)}100%{transform:none}}
@keyframes thTw{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:none}}

function exploreMap(list){return islandSVG({explore:true,prov:S.provF,zoom:!S.provF&&!S.mapAll?'qeshm':undefined,pins:list.map(x=>({id:x.a.id,place:x.a.place,color:ROLES[x.p.role].c})),me:'قشم'})}
function bindPins(root){

  root.querySelectorAll('.pin').forEach(p=>{const f=()=>{const el=document.querySelector(`.acard[data-id="${p.dataset.id}"]`);root.querySelectorAll('.pin').forEach(x=>x.classList.toggle('sel',x===p));
    if(el){el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}};

}

const WK_L=['ش','ی','د','س','چ','پ','ج'],WK_ST={a:'آزاد',b:'رزرو',o:'تعطیل'};
function weekBar(w,style=''){w=w||['o','o','o','o','o','o','o'];const lbl=w.map((d,i)=>DAYF[i]+': '+(WK_ST[d]||'تعطیل')).join('، ');
  return `<div class="weekw" style="${style}"><div class="week" role="img" aria-label="روزهای این هفته — ${lbl}" title="${lbl}">${w.map(d=>`<i class="${d}"></i>`).join('')}</div><div class="week-l" aria-hidden="true">${WK_L.map((x,i)=>`<span class="${w[i]}">${x}</span>`).join('')}</div></div>`}
// «۹٬۵۰۰٬۰۰۰ تومان هر تن» + «تنی» تکراری نشود: واحد فقط یک بار
function wageTxt(a){const w=String(a.wage||''),t=a.wageType||'';if(!t||t==='توافقی'||t==='پروژه‌ای'||/هر |روزانه|متری|ساعتی|تنی|پروژه|روزی|ماهانه/.test(w))return w;
  return w+' '+({'تنی':'هر تن','متری':'هر متر','ساعتی':'هر ساعت','هر بازدید':'هر بازدید'}[t]||t)}
function adCard(a,p,k=0,preview){
  const rc=ROLES[p.role].c, tr=trustOf(p);

    foot=`<div style="flex:1">${weekBar(p.week,'max-width:150px')}<span>${fa(free)} روز آزاد این هفته</span></div>`;}

    foot=`<div style="display:flex;align-items:center;gap:8px"><div class="helmets" aria-hidden="true">${Array.from({length:Math.min(n,5)},(_,i)=>I.helmet(i<f)).join('')}</div><span>نیاز ${fa(n)} نفر · ${fa(a.resp)} اعلام آمادگی</span></div>`;}
  else foot=`<span style="display:inline-flex;align-items:center;gap:6px">${I.chat.replace('class="ico"','class="ico" style="width:18px;height:18px"')}${fa(a.resp)} پاسخ از ${a.aud.map(r=>ROLES[r].n).join(' و ')}</span>`;
  const meta=a.type==='consult'?`<span>${I.pin}<b>${esc(placeLbl(a.place))}</b></span><span>${I.clock}${esc(a.posted)}</span>`

  </div>`;
}

function tower(tr){
  const parts=[['هویت',10,tr.id,'#2DD4BF'],['نظرها',10,tr.r,'#5EA8FF'],['پروژه',25,tr.pr,'#B9C0CA'],['همکاری',55,tr.c,'#F97316']];
  let y=146,s='';
  parts.forEach(([n,max,v,col],i)=>{const H=max*1.25, h=v*1.25; y-=H;
    s+=`<rect x="22" y="${y}" width="56" height="${H-2}" rx="3" fill="none" stroke="rgba(255,255,255,.22)" stroke-dasharray="3 3"/>`;

    <g class="chain-node"><polygon points="170,66 193,79 193,105 170,118 147,105 147,79" fill="${ROLES[p.role].c}"/><text x="170" y="97" text-anchor="middle" fill="#fff" font-size="14" font-weight="900" font-family="Vazirmatn,Tahoma">${p.ini}</text></g>${nodes}</svg>

function sealSVG(code){
  let h=2166136261;for(const ch of code){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
  let cells='';for(let y=0;y<5;y++)for(let x=0;x<3;x++){const bit=(h>>(y*3+x))&1;const col=((h>>(15+y+x))&1)?'var(--gold)':'var(--accent)';
    if(bit){const d=200+y*170+x*40;cells+=`<rect style="animation-delay:${d}ms" x="${x*8}" y="${y*8}" width="7" height="7" rx="1.5" fill="${col}"/>`;if(x<2)cells+=`<rect style="animation-delay:${d}ms" x="${(4-x)*8}" y="${y*8}" width="7" height="7" rx="1.5" fill="${col}"/>`}}
  return `<svg viewBox="-2 -2 43 43">${cells}</svg>`;
}
function stampSVG(ok){

  <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3" ${ok?'':'stroke-dasharray="5 4"'}/><circle cx="50" cy="50" r="27" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text style="font-size:12px;font-weight:700;font-family:Vazirmatn,Tahoma" fill="currentColor"><textPath href="#stc">${t}</textPath></text>
  ${ok?'<path d="M38 51l8 8 16-17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>':'<text x="50" y="57" text-anchor="middle" style="font-size:20px;font-weight:900" fill="currentColor">؟</text>'}</svg>`;
}

function monthsBars(p){
  const M=['آبان','آذر','دی','بهمن','اسفند','فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر'];
  let h=7;for(const ch of p.code)h=(h*31+ch.charCodeAt(0))>>>0;
  const w=M.map((_,k)=>{h=(h*1103515245+12345)>>>0;return .7+((h>>8)%100)/100*.9*(k>5?1.2:1)});
  const tot=w.reduce((a,b)=>a+b,0);let vals=w.map(x=>Math.round(x/tot*p.done));
  const mx=Math.max(1,...vals);
  return vals.map((v,k)=>({m:[0,3,6,11].includes(k)?M[k]:'',h:p.done?Math.max(8,v/mx*100):4}));
}

function bindSwipe(it){

  const end=()=>{if(x0===null)return;it.classList.remove('drag');if(drag){const b=open?W:0,v=Math.max(0,Math.min(W,b+dx));open=v>60;it.style.transform=open?`translateX(${W}px)`:''}x0=null};
  it.addEventListener('pointerup',end);it.addEventListener('pointercancel',end);it.addEventListener('pointerleave',end);
  it.addEventListener('click',e=>{if(drag){e.preventDefault();drag=false;return}if(open){open=false;it.style.transform='';return}openChat(it.dataset.id)});
}

function startRec(){
  S.rec={t:Date.now()};const cb=$('cbar');
  cb.querySelector('.field-w').outerHTML=`<div class="recbar" id="recbar"><span class="dot"></span><small id="recT">۰:۰۰</small><div class="wf" id="recW">${'<i style="height:30%"></i>'.repeat(22)}</div><button onclick="event.stopPropagation();stopRec(false)">لغو</button></div>`;
  $('sndB').classList.add('rec');
  S.recI=setInterval(()=>{const s=Math.floor((Date.now()-S.rec.t)/1000);$('recT').textContent=fa('0:'+String(s).padStart(2,'0'));const w=$('recW');w.firstElementChild.remove();const i=document.createElement('i');i.style.height=(20+Math.random()*80)+'%';w.appendChild(i)},120);
}
function stopRec(send){clearInterval(S.recI);const d=S.rec?Math.max(1,Math.round((Date.now()-S.rec.t)/1000)):0;S.rec=null;
  $('cbar').innerHTML=cbarHTML();bindComposer();if(send)pushMsg({me:1,k:'voice',dur:d},true);else toast('ضبط لغو شد')}
function nowT(){const d=new Date();return fa(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'))}
function pushMsg(m,reply){
  const c=S.convs.find(x=>x.id===S.cid);m.time=m.time||nowT();if(m.me)m.st='sent';c.msgs.push(m);
  const i=c.msgs.length-1;$('msgs').insertAdjacentHTML('beforeend',msgHTML(m,i,c));scrollEnd();
  if(m.me&&reply){
    setTimeout(()=>{m.st='read';const el=$('m'+i);if(el&&S.mprefs.read)el.querySelector('.meta').innerHTML=m.time+tickSVG('read')},900);
    setTimeout(()=>{if(S.cur!=='chat'||S.cid!==c.id)return;$('msgs').insertAdjacentHTML('beforeend',`<div class="typing" id="typing"><i></i><i></i><i></i><span>در حال نوشتن…</span></div>`);scrollEnd()},1200);
    setTimeout(()=>{const t=$('typing');if(t)t.remove();if(S.cur!=='chat'||S.cid!==c.id)return;
      if(m.k==='deal'){m.st='ok';rerenderMsg(i);animLock(i);addSys(c,'توافق ثبت شد؛ هر دو طرف تأیید کردند.');setStage(c,1);return}
      if(m.k==='day'){m.st='ok';rerenderMsg(i);return}
      const r=c.replies[(c.ri=(c.ri||0))%c.replies.length];c.ri++;pushMsg({me:0,k:'text',t:r},false)},2800);
  }
}
function rerenderMsg(i){const c=S.convs.find(x=>x.id===S.cid);const el=$('m'+i);if(el)el.outerHTML=msgHTML(c.msgs[i],i,c)}
function animLock(i){const l=$('lk'+i);if(!l)return;l.classList.remove('done');void l.offsetWidth;requestAnimationFrame(()=>l.classList.add('done'))}
function addSys(c,t){c.msgs.push({k:'sys',t});$('msgs').insertAdjacentHTML('beforeend',`<div class="sys">${esc(t)}</div>`);scrollEnd()}
function setStage(c,s){c.stage=s;document.querySelectorAll('.cstep > div').forEach((d,k)=>{d.className=k<s?'d':k===s?'n':''})}
function flySend(){const b=$('sndB');if(!b)return;b.classList.remove('fly');void b.offsetWidth;b.classList.add('fly')}
function sendText(t){flySend();const inp=$('cIn');if(inp){inp.value='';inp.dispatchEvent(new Event('input'))}pushMsg({me:1,k:'text',t},true)}
function ansDeal(i,st){const c=S.convs.find(x=>x.id===S.cid);c.msgs[i].st=st;rerenderMsg(i);if(st==='ok'){animLock(i);addSys(c,'توافق ثبت شد؛ هر دو طرف تأیید کردند.');setStage(c,1);toast('توافق ثبت شد')}else toast('پیشنهاد رد شد')}
function ansDay(i,st){const c=S.convs.find(x=>x.id===S.cid);c.msgs[i].st=st;rerenderMsg(i);if(st==='ok'){addSys(c,'روز شروع هماهنگ شد: '+c.msgs[i].t);if(c.stage<1)setStage(c,1)}else pickDayProposal()}
let vp=null;
function playVoice(i){
  const c=S.convs.find(x=>x.id===S.cid),m=c.msgs[i],bars=[...$('wf'+i).children],btn=$('pl'+i),tEl=$('vt'+i);
  if(vp&&vp.i===i){clearInterval(vp.t);vp=null;btn.innerHTML=MI.play;return}
  if(vp){clearInterval(vp.t);const ob=$('pl'+vp.i);if(ob)ob.innerHTML=MI.play}
  let k=0;const steps=bars.length,per=m.dur*1000/steps;btn.innerHTML=MI.pause;bars.forEach(b=>b.classList.remove('on'));
  vp={i,t:setInterval(()=>{if(k<steps){bars[k].classList.add('on');k++;tEl.textContent=fa('0:'+String(Math.round(k*per/1000)).padStart(2,'0'))}else{clearInterval(vp.t);vp=null;btn.innerHTML=MI.play;setTimeout(()=>{bars.forEach(b=>b.classList.remove('on'));tEl.textContent=fa('0:'+String(m.dur).padStart(2,'0'))},600)}},per)};
}

function startAuth(){S.reg={step:'phone',phone:'',ok:false,role:null,i:0,d:{},t:0};go('auth')}
function renderAuth(){
  const r=S.reg, el=$('s-auth');
  if(r.step==='phone'){
    el.innerHTML=`<div class="auth-top"><button class="icon-btn" aria-label="بازگشت" onclick="back()">${I.back}</button></div>
    <div class="auth-hero"><div class="auth-logo">${logoSVG('anim')}</div>
      <h1>ورود به ${wordmark('anim md')}</h1><p>با شمارهٔ موبایل وارد شو یا حساب تازه بساز.</p></div>
    <div class="section"><label class="label" for="ph">شمارهٔ موبایل</label>
      <div class="phone-in"><span>۰۹</span><input id="ph" dir="ltr" inputmode="numeric" maxlength="9" placeholder="xx xxx xxxx" value="${esc(r.phone)}" oninput="this.value=this.value.replace(/[^0-9۰-۹]/g,'');S.reg.phone=this.value;chkPhone()"></div>
      <label class="agree"><input type="checkbox" id="agr" onchange="chkPhone()" ${r.ok?'checked':''}><span><a href="#" onclick="event.preventDefault();openLegal('terms')">قوانین استفاده</a> و <a href="#" onclick="event.preventDefault();openLegal('privacy')">حریم خصوصی</a> بلوک را می‌پذیرم.</span></label>
      <button class="cta" id="phBtn" disabled onclick="sendOtp()">دریافت کد تأیید</button>
      <button class="ghost" onclick="S.pending=null;go('explore')">فعلاً فقط آگهی‌ها را می‌بینم</button></div>`;
    chkPhone();
  }
  if(r.step==='otp'){
    el.innerHTML=`<div class="auth-top"><button class="icon-btn" aria-label="تغییر شماره" onclick="S.reg.step='phone';renderAuth()">${I.back}</button></div>
    <div class="auth-hero"><div class="sms" aria-hidden="true"><svg viewBox="0 0 90 70"><rect x="8" y="12" width="74" height="48" rx="8" fill="var(--accent)"/><path class="flap" d="M8 18l37 24 37-24" fill="none" stroke="#fff" stroke-width="3"/></svg></div>
      <h1>کد را وارد کن</h1><p>کد ۵ رقمی به <b dir="ltr" style="unicode-bidi:isolate">۰۹${fa(r.phone)}</b> فرستاده شد.</p></div>
    <div class="section"><div class="otp" id="otp" dir="ltr">${[0,1,2,3,4].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="رقم ${i+1}" oninput="otpIn(this,${i})" onkeydown="if(event.key==='Backspace'&&!this.value&&this.previousElementSibling)this.previousElementSibling.focus()">`).join('')}</div>
      <p class="hint center">در نسخهٔ نمایشی، کد <b>۱۲۳۴۵</b> است.</p>
      <p class="center" id="otpT" style="color:var(--muted);font-size:14px"></p></div>`;
    otpTimer();setTimeout(()=>{const f=document.querySelector('#otp input');if(f)f.focus()},200);
  }
  if(r.step==='role'){
    el.innerHTML=`<div class="auth-top"><button class="icon-btn" aria-label="بازگشت" onclick="S.reg.step='phone';renderAuth()">${I.back}</button></div>
    <div class="auth-hero small"><h1>در بلوک چه کاره‌ای؟</h1><p>ثبت‌نام هر نقش مخصوص همان کار است. بعداً می‌توانی نقش دیگری هم اضافه کنی.</p></div>
    <div class="section"><div class="rolepick">${Object.entries(ROLE_INFO).map(([k,v],i)=>`<button style="animation-delay:${i*60}ms;--c:${ROLES[k].c}" onclick="pickRole('${k}')"><span class="rp-ic">${v[2]}</span><div><b>${v[0]}</b><small>${v[1]}</small></div><span class="rp-n num">${fa(REG[k].length)} مرحله</span></button>`).join('')}</div></div>`;
  }
  if(r.step==='form')renderRegStep();
  if(r.step==='done')renderRegDone();
}

function chkPhone(){const r=S.reg,v=(r.phone||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)),ag=$('agr');r.ok=ag&&ag.checked;const b=$('phBtn');if(b)b.disabled=!(v.length===9&&r.ok)}
function sendOtp(){S.reg.step='otp';S.reg.t=Date.now();renderAuth();toast('کد تأیید فرستاده شد')}
function otpTimer(){clearInterval(S.otpI);const upd=()=>{const el=$('otpT');if(!el){clearInterval(S.otpI);return}const s=Math.max(0,120-Math.floor((Date.now()-S.reg.t)/1000));
  el.innerHTML=s?`ارسال دوباره تا <b class="num">${fa(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'))}</b>`:`<button class="lnk2" onclick="S.reg.t=Date.now();otpTimer();toast('کد دوباره فرستاده شد')">ارسال دوبارهٔ کد</button>`};upd();S.otpI=setInterval(upd,1000)}
function otpIn(inp,i){inp.value=inp.value.replace(/[^0-9۰-۹]/g,'').slice(-1);if(inp.value&&inp.nextElementSibling)inp.nextElementSibling.focus();
  const v=[...document.querySelectorAll('#otp input')].map(x=>x.value).join('').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  if(v.length===5){const box=$('otp');if(v==='12345'){box.classList.add('good');clearInterval(S.otpI);setTimeout(()=>{S.reg.step='role';renderAuth()},650)}else{box.classList.remove('bad');void box.offsetWidth;box.classList.add('bad');toast('کد درست نیست');setTimeout(()=>{document.querySelectorAll('#otp input').forEach(x=>x.value='');document.querySelector('#otp input').focus()},450)}}}
function pickRole(k){const r=S.reg;r.role=k;r.i=0;r.d={};REG[k].forEach(st=>st.f.forEach(f=>{if(f.def)r.d[f.k]=true}));r.step='form';renderAuth()}
function vis(f,d){return !f.show||f.show(d)}

  if(f.t==='area')return lab+`<textarea class="field" id="${id}" placeholder="${f.ph||''}" oninput="S.reg.d['${f.k}']=this.value;updRegBtn()">${esc(d[f.k]||'')}</textarea>`;
  if(f.t==='num')return lab+`<div class="numf"><input class="field" id="${id}" inputmode="numeric" placeholder="${f.ph||''}" value="${esc(d[f.k]||'')}" oninput="this.value=this.value.replace(/[^0-9۰-۹٬,]/g,'');S.reg.d['${f.k}']=this.value;updRegBtn()"><span>${f.unit||''}</span></div>`;

  if(f.t==='days'){const a=d[f.k]||[];return `<span class="label">${f.label}</span><div class="days">${DAYS.map((x,i)=>`<button class="day ${a.includes(i)?'a':'o'}" onclick="togMulti('${f.k}',${i},7)" aria-pressed="${a.includes(i)}">${x[0]}<b class="num">${x[1]}</b>${a.includes(i)?'آزاد':'—'}</button>`).join('')}</div>`}

S.est={area:120,fl:3,fr:'c',q:'mid',saved:[]};
const EST={
  fr:{c:{n:'اسکلت بتنی',con:.42,reb:42,stl:0,lab:3.2,k:1},s:{n:'اسکلت فلزی',con:.28,reb:22,stl:48,lab:2.8,k:1.06}},
  q:{eco:{n:'اقتصادی',p:26},mid:{n:'متوسط',p:34},lux:{n:'لوکس',p:48}},
  parts:[['اسکلت و فونداسیون',30,'var(--accent)'],['سفت‌کاری',20,'var(--r-contractor)'],['تأسیسات',18,'var(--r-engineer)'],['نازک‌کاری',22,'var(--gold)'],['پروانه و نظارت',10,'var(--concrete-2)']]};
function estCalc(){const e=S.est,f=EST.fr[e.fr],tot=e.area*e.fl,con=tot*f.con;
  const cost=tot*EST.q[e.q].p*f.k; /* میلیون تومان */
  return {tot,con:Math.round(con),cem:Math.round(con*7+tot*1.1),reb:+(tot*f.reb/1000).toFixed(1),stl:+(tot*f.stl/1000).toFixed(1),blk:Math.round(tot*27/100)*100,lab:Math.round(tot*f.lab),
    lo:cost*.9,hi:cost*1.12,mon:Math.round(4+e.fl*1.8)}}

    <h4>مادهٔ ۲ · موضوع</h4><p><b>${esc(p.t)}</b> مطابق توافق ثبت‌شده در چت بلوک.${p.deal?`<br><span>مقدار:</span> <b>${esc(p.deal.qty)}</b> · <span>دستمزد:</span> <b>${esc(p.deal.price)}</b><br><span>شروع:</span> <b>${esc(p.deal.start)}</b> · <span>مدت:</span> <b>${esc(p.deal.dur)}</b>`:''}</p>

    <h4>مادهٔ ۵ · تضمین</h4><p class="num">${fa(c.ret)}٪ از مبلغ کل به‌عنوان حسن انجام کار نزد کارفرما می‌ماند و ۳ ماه پس از تحویل پرداخت می‌شود.</p>
    <h4>مادهٔ ۶ · بیمه و ایمنی</h4><p>ایمنی کارگاه و بیمهٔ نیروهای مجری بر عهدهٔ مجری است؛ تجهیزات حفاظت فردی الزامی است.</p>
    <h4>مادهٔ ۷ · اختلاف و داوری</h4><p>طرفین می‌پذیرند هر اختلاف ابتدا با گفت‌وگو در چت بلوک (۴۸ ساعت) و در صورت حل نشدن، با <b>داوری حضوری بلوک</b> حل شود: یک حل‌کنندهٔ مستقل و تأییدشده در همان حوزه (مهندس یا متخصص) از محل بازدید می‌کند و گزارش و رأی می‌دهد. هزینهٔ داوری را ثبت‌کنندهٔ اختلاف پیش از تعیین حل‌کننده می‌پردازد. رأی پس از ۷۲ ساعت مهلت اعتراض (بازبینی با حل‌کنندهٔ دوم) برای طرفین لازم‌الاجراست. این ماده، موافقت‌نامهٔ داوری طرفین است.</p>

      <div class="${c.them?'on':''}"><small>امضای ${esc(w.name)}</small>${c.them?sigSVG('M8 24c6-14 14-16 16-4 2 10 10-12 16-10s4 16 12 6 12-12 18-2 16 6 22-4'):'<em>—</em>'}</div></div>
    ${st===2?`<div class="pp-seal" aria-hidden="true"><b>تأیید بلوک</b><small class="num">۱۴۰۵/۰۷/۰۴</small></div>`:''}
  </div></div>
  <div class="section">${st===0?`<button class="ghost" style="width:100%" onclick="ctrEdit('${key}')">ویرایش مراحل پرداخت و مدت</button><button class="cta" style="margin-top:8px" onclick="ctrSign('${key}')">امضای دیجیتال با کد تأیید</button>`

    <p class="est-note" style="margin-top:12px">قرارداد بلوک یک نمونهٔ استاندارد است. برای کارهای بزرگ، متن را با مشاور حقوقی هم بررسی کنید.</p></div>`;

function ctrEdit(key){const c=ctrOf(key);
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">مراحل پرداخت</h3><p class="sub">جمع درصدها باید ۱۰۰ باشد</p>
  ${c.ms.map((m,k)=>`<div class="ms-row"><input class="field" value="${esc(m[0])}" id="msn${k}"><div class="numf" style="width:96px"><input class="field" inputmode="numeric" value="${m[1]}" id="msp${k}" oninput="msSum(${c.ms.length})"><span>٪</span></div></div>`).join('')}
  <p class="ms-sum" id="msSum"></p>
  <span class="label">مدت اجرا (روز)</span><input class="field" inputmode="numeric" id="ctrD" value="${c.days}">
  <span class="label">حسن انجام کار</span><div class="chips">${[5,10,15].map(x=>`<button class="chip" aria-pressed="${c.ret===x}" onclick="pickOne(this);S._ret=${x}">${fa(x)}٪</button>`).join('')}</div>
  <button class="cta" onclick="ctrSave('${key}')">ذخیره</button>`;S._ret=c.ret;show();msSum(c.ms.length)}
function msSum(n){let s=0;for(let k=0;k<n;k++)s+=+(($('msp'+k).value+'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))||0;const el=$('msSum');el.textContent='جمع: '+fa(s)+'٪';el.className='ms-sum '+(s===100?'ok':'bad');return s}
function ctrSave(key){const c=ctrOf(key),n=c.ms.length;if(msSum(n)!==100){toast('جمع درصدها باید ۱۰۰ باشد');return}
  c.ms=c.ms.map((m,k)=>[$('msn'+k).value.trim()||m[0],+(($('msp'+k).value+'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))]);c.days=+$('ctrD').value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))||c.days;c.ret=S._ret;closeSheet();renderCtr();toast('قرارداد به‌روز شد')}
function ctrSign(key){const c=ctrOf(key);
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">امضای دیجیتال</h3><p class="sub">کد ۵ رقمی پیامک‌شده را وارد کنید (نمایشی: ۱۲۳۴۵)</p>
  <input class="field num" id="sigC" inputmode="numeric" maxlength="5" style="text-align:center;font-size:22px" placeholder="—————">
  <button class="cta" onclick="if(($('sigC').value+'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))==='12345'){closeSheet();doSign('${key}')}else toast('کد درست نیست')">امضا می‌کنم</button>`;show()}
function doSign(key){const c=ctrOf(key);c.me=true;renderCtr();toast('امضای شما ثبت شد؛ برای طرف مقابل فرستاده شد');
  setTimeout(()=>{c.them=true;if(window.onCtrSigned)onCtrSigned(key,c);if(S.cur==='ctr')renderCtr();toast('طرف مقابل هم امضا کرد؛ قرارداد فعال شد');if(S.notifs)S.notifs.unshift({g:'امروز',ty:'proj',t:'قرارداد امضا شد',s:c.p.t,time:'همین حالا',go:"go('pdet')",read:false})},2600)}

  const g=go;window.go=function(name,noPush){if(name==='team'&&!S.auth){gate('team',()=>g(name,noPush));return}g(name,noPush)};

  if(k==='build'&&p.d>=2)return {max:n,unit:B_UNIT[p.st[p.d]]||'طبقهٔ'};

function sitePct(p){const sd=subDef(p);return Math.round((p.d+(sd?(p.sub||0)/sd.max:.5))/p.st.length*100)}

function drawSite(p,mini){const k=siteKind(p),d=p.d,s=p.sub||0,n=p.fl||1;

  let body='',hookY=200,crane=true;
  if(k==='build'){const h=Math.min(30,178/n);
    /* زمین، گود و فونداسیون */
    body+=d===0?`<path class="ds-cur" d="M22 222 L30 214 H92 L100 222Z" fill="rgba(0,0,0,.35)" stroke="var(--gold)" stroke-width="1.5"/><path d="M104 222 q8 -14 18 0z" fill="#6B5B4A"/><g class="ds-dig"><path d="M60 196 l12 12" stroke="var(--gold)" stroke-width="3"/><rect x="66" y="204" width="12" height="7" rx="2" fill="var(--gold)"/></g>`
      :`<rect x="8" y="217" width="102" height="5" rx="1" fill="${d>1?'var(--concrete)':'rgba(249,115,22,.25)'}" ${d===1?'class="ds-cur" stroke="var(--gold)" stroke-width="1.5"':''}/>${d===1?[16,30,44,58,72,86,100].map(x=>`<path d="M${x} 212v10" stroke="var(--gold)" stroke-width="1.5"/>`).join(''):''}`;
    for(let f=0;f<n;f++){const yb=217-f*h,yt=yb-h;let g=`<rect x="12" y="${yt}" width="94" height="${h}" fill="none" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 3"/>`;
      /* سفت‌کاری: دیوار بلوکی */
      if(done(4,f)||cur(4,f))g+=`<rect class="${cur(4,f)?'ds-grow':''}" x="17" y="${yt+3}" width="84" height="${h-3}" fill="rgba(214,168,128,.55)"/>`;
      /* نازک‌کاری: نما و پنجره‌ها */
      if(done(6,f)||cur(6,f))g+=`<rect x="17" y="${yt+3}" width="84" height="${h-3}" fill="#E9E2D3" class="${cur(6,f)?'ds-cur':''}"/>`;
      if(done(4,f)||d>4)for(let w=0;w<3;w++)g+=`<rect x="${24+w*27}" y="${yt+h*.3}" width="12" height="${h*.42}" rx="1.5" fill="${done(6,f)?(w+f)%2?'#FDBA74':'#FED7AA':'var(--night-2)'}" class="${done(6,f)&&(w+f)%2?'ds-lit':''}"/>`;
      /* تأسیسات: لوله و سیم */
      if(done(5,f)||cur(5,f))g+=`<path d="M17 ${yb-3}H101" stroke="#38BDF8" stroke-width="1.6" ${cur(5,f)?'class="ds-flow" stroke-dasharray="4 3"':''}/><path d="M17 ${yt+5}H101" stroke="#FACC15" stroke-width="1.2" ${cur(5,f)?'class="ds-flow" stroke-dasharray="3 3"':''}/>`;
      /* اسکلت: ستون‌ها */
      if(done(2,f)||d>2||cur(2,f))g+=[12,41,71,101].map(x=>`<rect x="${x}" y="${yt+2}" width="5" height="${h-2}" fill="${cur(2,f)?'rgba(249,115,22,.35)':'var(--concrete)'}" ${cur(2,f)?'class="ds-cur" stroke="var(--gold)" stroke-width="1"':''}/>`).join('');
      /* سقف */
      if(done(3,f)||d>3)g+=`<rect x="9" y="${yt-1}" width="100" height="4" rx="1" fill="var(--concrete)"/>`;

const faDig=/[۰-۹]/g,toLat=s=>s.replace(faDig,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function i18nNode(root){if(!root)return;const en=S.prefs.lang==='en',lat=S.prefs.latin;if(!en&&!lat)return;
  if(root.nodeType===3){const v=en?tr(root.nodeValue).replace(/‹/g,'›'):toLat(root.nodeValue).replace(/٬/g,',').replace(/٫/g,'.');if(v!==root.nodeValue)root.nodeValue=v;return}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);let n;const L=[];while(n=w.nextNode())L.push(n);
  L.forEach(t=>{const o=t.nodeValue;if(!o.trim())return;const v=en?tr(o).replace(/‹/g,'›'):toLat(o).replace(/٬/g,',').replace(/٫/g,'.');if(v!==o)t.nodeValue=v});
  if(en&&root.querySelectorAll){const els=[root,...root.querySelectorAll('[placeholder],[aria-label],[title]')];els.forEach(e=>{if(!e.getAttribute)return;['placeholder','aria-label','title'].forEach(a=>{const p=e.getAttribute(a);if(p&&hasFa(p))e.setAttribute(a,tr(p))})})}}
let i18nBusy=false;
const i18nObs=new MutationObserver(ms=>{if(i18nBusy)return;i18nBusy=true;try{ms.forEach(m=>{if(m.type==='characterData')i18nNode(m.target);else m.addedNodes.forEach(x=>i18nNode(x))})}finally{i18nBusy=false}});

/* ---- اعمال تنظیمات ---- */
function applyPrefs(){const r=document.documentElement,p=S.prefs;
  r.style.setProperty('--uiz',FS[p.fs]?FS[p.fs][1]:1);r.dataset.fs=p.fs;
  r.toggleAttribute('data-contrast',!!p.contrast);r.toggleAttribute('data-motion-off',!!p.motion);r.toggleAttribute('data-bold',!!p.bold);r.toggleAttribute('data-big',!!p.big);
  const en=p.lang==='en';r.lang=en?'en':'fa';r.dir=en?'ltr':'rtl';r.toggleAttribute('data-en',en);
  document.querySelectorAll('.app,.nav,.sheet').forEach(e=>{e.setAttribute('dir',en?'ltr':'rtl');e.setAttribute('lang',en?'en':'fa')});
  i18nObs.disconnect();if(en||p.latin){i18nNode(document.body);i18nObs.observe(document.body,{childList:true,subtree:true,characterData:true})}}
function setPref(k,v){S.prefs[k]=v;savePrefs();const needRe=k==='lang'||k==='latin';applyPrefs();
  if(k==='haptic'&&v&&navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
  if(needRe)render();else if(S.cur==='set')renderSet();if($('prefSheet'))$('prefSheet').innerHTML=prefsHTML()}
function prefsSheet(){sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">نمایش و زبان</h3><div id="prefSheet">${prefsHTML()}</div>`;show();if(S.prefs.lang==='en'||S.prefs.latin)i18nNode($('sheet'))}
function resetPrefs(){S.prefs=Object.assign({},PREF_DEF);savePrefs();applyPrefs();render();toast('تنظیمات نمایش به حالت پیش‌فرض برگشت')}

  return `<div class="section"><div class="sec-head"><h3>نمایش و دسترسی‌پذیری</h3></div>
  <div class="card pf-prev" aria-hidden="true"><small>پیش‌نمایش</small><div class="pp-row">${hexA(P.reza)}<div style="flex:1;min-width:0"><b>۲ آرماتوربند برای سقف دوم</b><span>درگهان · ۹٬۵۰۰٬۰۰۰ تومان هر تن</span></div><button class="mini yes" tabindex="-1">چت</button></div></div>
  <div class="card" style="display:grid;gap:14px;margin-top:8px">
    <div><span class="label" style="margin-top:0">اندازهٔ نوشته</span><div class="fs-seg">${Object.entries(FS).map(([k,v],i)=>`<button aria-pressed="${p.fs===k}" onclick="setPref('fs','${k}')" style="--s:${14+i*2.5}px"><b>آ</b><small>${v[0]}</small></button>`).join('')}</div></div>
    <div><span class="label" style="margin-top:0">زبان</span><div class="seg2"><button aria-pressed="${p.lang==='fa'}" onclick="setPref('lang','fa')">فارسی</button><button aria-pressed="${p.lang==='en'}" onclick="setPref('lang','en')">English</button></div>
      ${p.lang==='en'?`<p class="est-note" style="margin:6px 0 0">English covers menus, titles, buttons and settings; ads and messages stay in the language they were written in.</p>`:''}</div>
    ${tg('contrast','کنتراست بالا','رنگ‌ها و مرزها پررنگ‌تر برای نور آفتاب کارگاه')}
    ${tg('bold','نوشتهٔ پررنگ','خواناتر روی صفحه‌های کوچک')}
    ${tg('big','دکمه‌های بزرگ (حالت دستکش)','لمس راحت‌تر با دستکش یا دست خاکی')}

    ${tg('latin','اعداد لاتین','نمایش ۱۲۳ به‌صورت 123')}
    ${tg('saver','صرفه‌جویی اینترنت','عکس‌ها فقط با وای‌فای بارگذاری شوند')}

const ROLE_RANK={worker:1,specialist:2,engineer:3,contractor:4,company:5,general:6};
const faInt=s=>+(String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).match(/\d+/)||[0])[0];
/* افزودن پروژه به ابتدای فهرست بدون به‌هم‌ریختن داده‌های کلیددار (قرارداد، صورت‌وضعیت، پرداخت، گزارش روزانه) */
function projUnshift(p){const r=S.role;(S.projs[r]=S.projs[r]||[]).unshift(p);
  [S.ctr,S.sov,S.pays,S.daily].forEach(st=>{if(!st)return;const ks=Object.keys(st).filter(k=>k.startsWith(r+':')).sort((a,b)=>+b.split(':')[1]-+a.split(':')[1]);
    ks.forEach(k=>{const i=+k.split(':')[1];st[r+':'+(i+1)]=st[k];delete st[k]})});
  return 0}
function projIdx(m){const L=S.projs[m.projRole]||[];return L.indexOf(m.proj)}
function linkDeal(c,m){if(!m||m.k!=='deal'||m.proj)return;const o=c.pid&&(P[c.pid]||null),d=m.d;
  const p={t:d.job,who:c.pid,stage:1,amt:(d.qty?d.qty+' · ':'')+d.price,rating:0,deal:Object.assign({},d),cid:c.id,
    meClient:o?ROLE_RANK[S.role]>ROLE_RANK[o.role]:S.role==='general'};
  m.proj=p;m.projRole=S.role;projUnshift(p);
  const key=S.role+':0';
  S.ctr[key]={ms:[['پیش‌پرداخت',20],['پایان کار',70],['حسن انجام کار (۳ ماه بعد)',10]],days:Math.max(1,faInt(d.dur)||7),ret:10,me:false,them:false,p};
  if(S.notifs)S.notifs.unshift({g:'امروز',ty:'proj',t:'پروژهٔ تازه از توافق چت',s:'پیش‌نویس قرارداد آماده است',time:'همین حالا',go:"go('proj')",read:false});
  setTimeout(()=>toast('به «پروژه‌های من» اضافه شد؛ پیش‌نویس قرارداد آماده است'),600)}
function openDealCtr(ci,mi){const c=S.convs.find(x=>x.id===ci),m=c&&c.msgs[mi];if(!m||!m.proj)return;const i=projIdx(m);if(i<0){toast('این پروژه دیگر در فهرست نیست');return}
  if(S.role!==m.projRole){toast('برای دیدن قرارداد به همان نقش برگرد');return}openContract(i)}

/* =================== ROUND 17: مراحل پرداخت انتخابی (توسط خود کاربران) =================== */
const PAY_PLANS={end:['یکجا پس از پایان کار',[['پس از پایان کار',100]]],
  two:['پیش‌پرداخت + پایان کار',[['پیش‌پرداخت',30],['پایان کار',70]]],
  three:['سه مرحله با حسن انجام کار',[['پیش‌پرداخت',20],['پایان کار',70],['حسن انجام کار (۳ ماه بعد)',10]]],
  weekly:['هفتگی',[['هفتهٔ اول',25],['هفتهٔ دوم',25],['هفتهٔ سوم',25],['هفتهٔ چهارم',25]]],
  stage:['بر اساس مرحلهٔ ساخت',[['پیش‌پرداخت',10],['پایان اسکلت',30],['پایان سفت‌کاری',30],['تحویل',20],['حسن انجام کار',10]]]};
let PE={ms:[],plan:null};
const peNum=v=>+String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\d]/g,'')||0;
const peSum=()=>PE.ms.reduce((s,m)=>s+(+m[1]||0),0);
function peSet(ms,plan){PE.ms=ms.map(m=>[m[0],m[1]]);PE.plan=plan||null}
function peHTML(){const s=peSum();return `<div class="pe-plans">${Object.entries(PAY_PLANS).map(([k,v])=>`<button class="chip" aria-pressed="${PE.plan===k}" onclick="pePick('${k}')">${v[0]}</button>`).join('')}<button class="chip" aria-pressed="${PE.plan==='custom'}" onclick="PE.plan='custom';peDraw()">دلخواه</button></div>
  <div class="pe-bar" aria-hidden="true">${PE.ms.map((m,k)=>`<i style="flex:${Math.max(+m[1]||0,0.001)};--k:${k}"></i>`).join('')}</div>
  ${PE.ms.map((m,k)=>`<div class="pe-row"><i class="num">${fa(k+1)}</i><input class="field" value="${esc(S.prefs&&S.prefs.lang==='en'?tr(m[0]):m[0])}" placeholder="نام مرحله، مثلاً پایان اسکلت" oninput="PE.ms[${k}][0]=this.value;PE.plan='custom'"><div class="numf pe-pct"><input class="field num" inputmode="numeric" value="${S.prefs&&(S.prefs.lang==='en'||S.prefs.latin)?m[1]:fa(m[1])}" oninput="PE.ms[${k}][1]=peNum(this.value);PE.plan='custom';peSumDraw()"><span>٪</span></div><button class="pe-x" aria-label="حذف مرحله" onclick="PE.ms.splice(${k},1);PE.plan='custom';peDraw()">×</button></div>`).join('')}
  <button class="pe-add" onclick="PE.ms.push(['',0]);PE.plan='custom';peDraw()">+ افزودن مرحلهٔ پرداخت</button>
  <p class="ms-sum ${s===100?'ok':'bad'}" id="peSum">جمع: ${fa(s)}٪ ${s===100?'✓':s<100?'· '+fa(100-s)+'٪ مانده':'· '+fa(s-100)+'٪ بیشتر از ۱۰۰'}</p>`}
function peDraw(){const b=$('peBox');if(b)b.innerHTML=peHTML()}
function peSumDraw(){const s=peSum(),e=$('peSum');if(e){e.className='ms-sum '+(s===100?'ok':'bad');e.textContent='جمع: '+fa(s)+'٪ '+(s===100?'✓':s<100?'· '+fa(100-s)+'٪ مانده':'· '+fa(s-100)+'٪ بیشتر از ۱۰۰')}
  const bar=document.querySelector('#peBox .pe-bar');if(bar)[...bar.children].forEach((x,k)=>x.style.flex=Math.max(+PE.ms[k][1]||0,0.001))}
function pePick(k){peSet(PAY_PLANS[k][1],k);peDraw()}
function peValid(){if(!PE.ms.length){toast('حداقل یک مرحلهٔ پرداخت لازم است');return false}
  if(PE.ms.some(m=>!String(m[0]).trim())){toast('نام همهٔ مرحله‌ها را بنویسید');return false}
  if(PE.ms.some(m=>!(+m[1]>0))){toast('درصد هر مرحله باید بیشتر از صفر باشد');return false}
  if(peSum()!==100){toast('جمع درصدها باید ۱۰۰ باشد');return false}return true}
const planTxt=ms=>ms.map(m=>fa(m[1])+'٪ '+m[0]).join(' · ');

/* فرم پیشنهاد توافق در چت: فرستنده مراحل پرداخت را انتخاب می‌کند */
window.dealForm=function(){peSet(PAY_PLANS.two[1],'two');
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">پیشنهاد توافق</h3><p class="sub">وقتی طرف مقابل تأیید کند، پروژه و پیش‌نویس قرارداد با همین اطلاعات ساخته می‌شود.</p>
  <span class="label">کار</span><input class="field" id="dJ" value="آرماتوربندی سقف دوم">
  <span class="label">مقدار</span><input class="field" id="dQ" value="حدود ۳ تن">
  <span class="label">دستمزد</span><input class="field" id="dP" value="۹٬۲۰۰٬۰۰۰ تومان هر تن">
  <span class="label">شروع</span><div class="chips" id="dS">${[['دوشنبه ۶ مهر',2],['سه‌شنبه ۷ مهر',3],['چهارشنبه ۸ مهر',4]].map((x,k)=>`<button class="chip" data-v="${x[0]}" aria-pressed="${k===0}" onclick="pickOne(this)">${x[0]}</button>`).join('')}</div>
  <span class="label">مدت</span><div class="chips" id="dD">${['۳ روز','۱ هفته','۲ هفته','۱ ماه'].map((x,k)=>`<button class="chip" data-v="${x}" aria-pressed="${k===0}" onclick="pickOne(this)">${x}</button>`).join('')}</div>
  <span class="label">مراحل پرداخت</span><div id="peBox">${peHTML()}</div>
  <button class="cta" onclick="dealSend()">فرستادن پیشنهاد</button>`;show()};

  const d={job:$('dJ').value.trim()||'کار ساختمانی',qty:$('dQ').value,price:$('dP').value,start:sel('dS').dataset.v+'، ۷ صبح',dur:sel('dD').dataset.v,plan:PE.ms.map(m=>[m[0].trim(),+m[1]])};

/* ویرایش مراحل پرداخت در صفحهٔ قرارداد */
window.ctrEdit=function(key){const c=ctrOf(key);peSet(c.ms,c.ms.length?'custom':null);
  const match=Object.entries(PAY_PLANS).find(([k,v])=>JSON.stringify(v[1])===JSON.stringify(c.ms));if(match)PE.plan=match[0];
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">مراحل پرداخت</h3><p class="sub">یک الگو انتخاب کنید یا مراحل را خودتان بسازید؛ جمع باید ۱۰۰٪ باشد.</p>

function ctrPlanSave(key){if(!peValid())return;const c=ctrOf(key);c.ms=PE.ms.map(m=>[m[0].trim(),+m[1]]);c.days=peNum($('ctrD').value)||c.days;c.ret=S._ret;closeSheet();renderCtr();toast('مراحل پرداخت ذخیره شد')}

(function(){
  /* بدون مراحل پرداخت، امضا ممکن نیست */
  const cs=ctrSign;window.ctrSign=function(key){const c=ctrOf(key);if(!c.ms.length){toast('اول مراحل پرداخت را انتخاب کنید');ctrEdit(key);return}cs(key)};

  /* ساخت پروژه از توافق: مراحل همان توافق، یا خالی تا خودشان انتخاب کنند */
  const ld=linkDeal;window.linkDeal=function(c,m){ld(c,m);const k=S.role+':0',ct=S.ctr[k];if(ct&&ct.p===m.proj)ct.ms=m.d.plan?m.d.plan.map(x=>[x[0],x[1]]):[]};

/* =================== ROUND 20: مدیریت گفت‌وگو از فهرست + کپی/حذف پیام =================== */
/* ---------- ۱) منوی هر گفت‌وگو در فهرست پیام‌ها ---------- */
function convHasSigned(c){return c.msgs.some(m=>m.k==='ctr'||(m.k==='deal'&&m.proj))}
function convMenu(id){const c=S.convs.find(x=>x.id===id);if(!c)return;
  const row=(ic,t,fn,st)=>`<button class="linkrow" ${st||''} onclick="${fn}"><span class="ic" ${st||''}>${ic}</span><span>${t}</span></button>`,sm='<svg';
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">${esc(convName(c))}</h3><p class="sub">${c.ctx?esc(c.ctx.label+': '+c.ctx.title):'گفت‌وگو'}</p>
  <div class="card" style="padding:4px 16px;box-shadow:none;background:var(--bg)">
    ${row(MI.bell.replace(sm,'<svg style="width:20px;height:20px"'),c.muted?'روشن کردن اعلان':'بی‌صدا کردن',`closeSheet();convAct('${id}','mute')`)}
    ${row(MI.pinA.replace(sm,'<svg style="width:20px;height:20px"'),c.pinned?'برداشتن سنجاق':'سنجاق کردن',`closeSheet();convAct('${id}','pin')`)}
    ${c.unread?row(MI.check.replace(sm,'<svg style="width:20px;height:20px"'),'علامت خوانده‌شده',`closeSheet();convRead('${id}')`):''}
    ${row(MI.arch.replace(sm,'<svg style="width:20px;height:20px"'),c.arch?'خروج از بایگانی':'بایگانی',`closeSheet();convAct('${id}','arch')`)}
    ${row('<svg class="ico" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>','حذف گفت‌وگو',`convDelAsk('${id}')`,'style="color:var(--bad)"')}</div>`;show()}
function convRead(id){const c=S.convs.find(x=>x.id===id);c.unread=0;renderMsgs();updNavBadge();toast('خوانده شد')}
function convDelAsk(id){const c=S.convs.find(x=>x.id===id);const signed=convHasSigned(c);
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">حذف گفت‌وگو؟</h3><p class="sub">همهٔ پیام‌های گفت‌وگو با ${esc(convName(c))} از فهرست تو پاک می‌شود.</p>
  ${signed?`<div class="note" style="margin-bottom:10px">${I.shield}<span>این گفت‌وگو توافق یا قرارداد ثبت‌شده دارد؛ پروژه و قرارداد در «پروژه‌های من» باقی می‌مانند و نسخهٔ طرف مقابل هم پاک نمی‌شود.</span></div>`:''}
  <button class="cta" style="background:var(--bad)" onclick="convDel('${id}')">حذف گفت‌وگو</button><button class="ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">انصراف</button>`;show()}
function convDel(id){const i=S.convs.findIndex(x=>x.id===id);if(i<0)return;const c=S.convs[i];S.convs.splice(i,1);S._lastDel={c,i};closeSheet();renderMsgs();updNavBadge();
  toast('گفت‌وگو حذف شد');const t=$('toast');if(t)t.insertAdjacentHTML('beforeend',` <button class="undo" onclick="convUndo()">بازگرداندن</button>`)}
function convUndo(){const d=S._lastDel;if(!d)return;S.convs.splice(d.i,0,d.c);S._lastDel=null;renderMsgs();updNavBadge();toast('بازگردانده شد')}

/* ---------- ۲) کپی و حذف پیام داخل چت ---------- */
function msgTextOf(m){if(m.k==='text')return m.t;if(m.k==='deal'&&m.d){const d=m.d;return `پیشنهاد توافق: ${d.job} · ${d.qty} · ${d.price} · شروع ${d.start} · مدت ${d.dur}`+(d.plan?' · پرداخت: '+d.plan.map(x=>x[1]+'٪ '+x[0]).join('، '):'')}
  if(m.k==='day')return m.t;if(m.k==='loc')return m.place?placeLbl(m.place):'';if(m.k==='phone')return m.num;if(m.k==='file')return m.name;return ''}
function msgDelState(m){if(!m.me)return [false,'فقط پیام‌های خودت را می‌توانی حذف کنی'];
  if(m.k==='deal'&&(m.proj||m.st==='ok'))return [false,'توافق تأییدشده و قرارداد آن قابل حذف نیست'];
  if(m.k==='deal'&&m.st==='no')return [false,'پیشنهاد پاسخ گرفته و قابل حذف نیست'];
  if(m.st==='read')return [false,'مخاطب پیام را دیده؛ دیگر قابل حذف نیست'];
  return [true,'']}
function msgMenu(i){const c=S.convs.find(x=>x.id===S.cid),m=c&&c.msgs[i];if(!m||['sys','date','del','ctr'].includes(m.k))return;
  const txt=msgTextOf(m),[can,why]=msgDelState(m);
  document.querySelectorAll('#msgs .bub.pick').forEach(b=>b.classList.remove('pick'));const el=$('m'+i);if(el)el.classList.add('pick');
  sb.innerHTML=`<div class="grab"></div><h3 id="sheetTitle">پیام</h3>${txt?`<p class="mm-prev">${esc(txt.length>120?txt.slice(0,120)+'…':txt)}</p>`:''}
  <div class="card" style="padding:4px 16px;box-shadow:none;background:var(--bg)">
    ${txt?`<button class="linkrow" onclick="msgCopy(${i})"><span class="ic">${I.copy}</span><span>کپی</span></button>`:''}
    <button class="linkrow" ${can?`style="color:var(--bad)" onclick="msgDel(${i})"`:'disabled aria-disabled="true" style="opacity:.55"'}><span class="ic" ${can?'style="color:var(--bad)"':''}><svg class="ico" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></span><span class="mm-t"><span>حذف برای همه</span>${can?'':`<small class="mm-why">${why}</small>`}</span></button></div>
  ${can?`<p class="est-note" style="margin:10px 0 0">تا وقتی مخاطب پیام را ندیده، می‌توانی آن را برای هر دو طرف حذف کنی.</p>`:''}`;show();
  const off=()=>{document.querySelectorAll('#msgs .bub.pick').forEach(b=>b.classList.remove('pick'))};$('scrim').addEventListener('click',off,{once:true})}
function msgCopy(i){const c=S.convs.find(x=>x.id===S.cid),t=msgTextOf(c.msgs[i]);closeSheet();document.querySelectorAll('#msgs .bub.pick').forEach(b=>b.classList.remove('pick'));
  const legacy=()=>{let ok=false;try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}toast(ok?'کپی شد':'کپی نشد؛ متن را دستی انتخاب کن')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('کپی شد'),legacy);else legacy()}
